<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — Planteer</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  min-height: 100%;
}

body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  font-family: Inter, Segoe UI, Arial, sans-serif;
  color: #f4f7fb;
  background:
    radial-gradient(circle at 20% 15%, rgba(85,230,138,.12), transparent 30%),
    radial-gradient(circle at 80% 85%, rgba(72,120,255,.10), transparent 30%),
    #070b12;
}

.page {
  width: 100%;
  max-width: 460px;
}

.logo {
  text-align: center;
  margin-bottom: 28px;
}

.logo a {
  color: #f4f7fb;
  text-decoration: none;
  font-size: 34px;
  font-weight: 900;
}

.logo span {
  color: #55e68a;
}

.card {
  border: 1px solid #263548;
  border-radius: 24px;
  padding: 34px;
  background: rgba(14,21,31,.94);
  box-shadow: 0 30px 100px rgba(0,0,0,.45);
}

h1 {
  margin: 0;
  text-align: center;
  font-size: 30px;
}

.subtitle {
  margin: 10px 0 28px;
  text-align: center;
  color: #91a0b4;
  line-height: 1.5;
}

.button {
  width: 100%;
  min-height: 50px;
  border: 0;
  border-radius: 11px;
  padding: 13px 18px;
  font: inherit;
  font-weight: 800;
  cursor: pointer;
}

.github {
  background: #f4f7fb;
  color: #10151d;
}

.google {
  margin-top: 12px;
  background: #182231;
  border: 1px solid #33445a;
  color: #f4f7fb;
}

.divider {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 24px 0;
  color: #65748a;
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
}

.divider::before,
.divider::after {
  content: "";
  height: 1px;
  flex: 1;
  background: #263548;
}

label {
  display: block;
  margin-bottom: 7px;
  color: #dce5ef;
  font-size: 13px;
  font-weight: 700;
}

input {
  width: 100%;
  height: 48px;
  margin-bottom: 16px;
  padding: 0 14px;
  border: 1px solid #2a3a4f;
  border-radius: 10px;
  outline: none;
  background: #0a111b;
  color: #f4f7fb;
  font: inherit;
}

input:focus {
  border-color: #55e68a;
}

.signin {
  background: #55e68a;
  color: #07100b;
}

.message {
  display: none;
  margin-top: 16px;
  padding: 12px 14px;
  border-radius: 10px;
  background: rgba(255,180,80,.10);
  border: 1px solid rgba(255,180,80,.30);
  color: #ffd49b;
  font-size: 13px;
  line-height: 1.5;
}

.bottom {
  margin-top: 24px;
  text-align: center;
  color: #718096;
  font-size: 13px;
}

.bottom a {
  color: #55e68a;
  text-decoration: none;
}

</style>
</head>

<body>

<div class="page">

  <div class="logo">
    <a href="index.html">Planteer<span>.</span></a>
  </div>

  <div class="card">

    <h1>Welcome back</h1>

    <p class="subtitle">
      Sign in to continue building your websites.
    </p>

    <button
      class="button github"
      id="githubButton"
      type="button">
      Continue with GitHub
    </button>

    <button
      class="button google"
      id="googleButton"
      type="button">
      Continue with Google
    </button>

    <div class="divider">
      or
    </div>

    <form id="loginForm">

      <label for="username">
        Username or email
      </label>

      <input
        id="username"
        name="username"
        type="text"
        autocomplete="username"
        required>

      <label for="password">
        Password
      </label>

      <input
        id="password"
        name="password"
        type="password"
        autocomplete="current-password"
        required>

      <button
        class="button signin"
        type="submit">
        Sign In
      </button>

    </form>

    <div
      class="message"
      id="message">
    </div>

    <div class="bottom">
      Don't have a Planteer account?
      <a href="signup.html">Create one</a>
    </div>

  </div>

</div>

<script>
const WORKER =
  "https://planteer.duncanhomeschool.workers.dev";

const githubButton =
  document.getElementById("githubButton");

const googleButton =
  document.getElementById("googleButton");

const loginForm =
  document.getElementById("loginForm");

const message =
  document.getElementById("message");


function showMessage(text) {
  message.textContent = text;
  message.style.display = "block";
}


githubButton.addEventListener("click", () => {
  window.location.href =
    WORKER + "/auth/github";
});


googleButton.addEventListener("click", () => {
  showMessage(
    "Google sign-in is not connected yet. The button is ready for the Google OAuth endpoint."
  );
});


loginForm.addEventListener("submit", async event => {
  event.preventDefault();

  const username =
    document.getElementById("username").value.trim();

  const password =
    document.getElementById("password").value;

  if (!username || !password) {
    showMessage("Enter your username/email and password.");
    return;
  }

  showMessage(
    "Regular Planteer account sign-in is not connected to the Worker yet."
  );
});


async function checkExistingSession() {
  try {
    const response =
      await fetch(
        WORKER + "/api/me",
        {
          credentials: "include"
        }
      );

    const data =
      await response.json();

    if (
      data.ok &&
      data.authenticated
    ) {
      window.location.href =
        "index.html";
    }

  } catch (error) {
    console.error(
      "Session check failed:",
      error
    );
  }
}


checkExistingSession();
</script>

</body>
</html>
