<script>
"use strict";

/*
=========================================================
 PLANTEER SIGN IN
=========================================================

This page DOES NOT authenticate with GitHub itself.

It sends the browser to:

https://planteer.duncanhomeschool.workers.dev/auth/github

The Worker then:

1. Creates the OAuth state.
2. Sends the user to GitHub.
3. GitHub authenticates the user.
4. GitHub sends the user back to:
   /auth/github/callback
5. The Worker creates the D1-backed session.
6. The Worker redirects the user to Planteer.

=========================================================
*/

const WORKER =
  "https://planteer.duncanhomeschool.workers.dev";

const githubButton =
  document.getElementById(
    "githubButton"
  );

const buttonText =
  document.getElementById(
    "buttonText"
  );

const status =
  document.getElementById(
    "status"
  );

const errorBox =
  document.getElementById(
    "error"
  );


/* =========================================================
   CHECK WHETHER ALREADY SIGNED IN
========================================================= */

async function checkExistingSession() {

  try {

    const response =
      await fetch(
        `${WORKER}/api/me`,
        {
          method: "GET",
          credentials: "include",
          headers: {
            "Accept":
              "application/json"
          }
        }
      );

    if (!response.ok) {
      return;
    }

    const data =
      await response.json();

    if (
      data.ok &&
      data.authenticated
    ) {

      status.textContent =
        "You are already signed in. Redirecting...";

      setTimeout(
        () => {
          window.location.href =
            "index.html";
        },
        500
      );
    }

  } catch (error) {

    console.log(
      "No existing session detected."
    );
  }
}


/* =========================================================
   GITHUB SIGN IN
========================================================= */

githubButton.addEventListener(
  "click",
  () => {

    githubButton.disabled =
      true;

    buttonText.textContent =
      "Connecting to GitHub...";

    status.textContent =
      "Opening GitHub authentication...";

    errorBox.style.display =
      "none";


    /*
     * THIS IS THE IMPORTANT PART.
     *
     * The browser goes to the Worker.
     * The Worker handles the OAuth flow.
     */

    window.location.href =
      `${WORKER}/auth/github`;
  }
);


/* =========================================================
   HANDLE OAUTH ERRORS
========================================================= */

function checkURLForErrors() {

  const params =
    new URLSearchParams(
      window.location.search
    );

  const error =
    params.get("error");

  if (!error) {
    return;
  }

  let message =
    "GitHub sign-in failed.";

  if (
    error === "access_denied"
  ) {
    message =
      "GitHub sign-in was cancelled.";
  }

  if (
    error === "configuration"
  ) {
    message =
      "Planteer authentication is not configured correctly.";
  }

  errorBox.textContent =
    message;

  errorBox.style.display =
    "block";

  status.textContent =
    "";

  githubButton.disabled =
    false;

  buttonText.textContent =
    "Try GitHub sign-in again";
}


/* =========================================================
   START
========================================================= */

checkURLForErrors();

checkExistingSession();
</script>
