<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Planteer</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  min-height: 100%;
}

body {
  min-height: 100vh;
  font-family:
    Inter,
    Segoe UI,
    Arial,
    sans-serif;
  color: #f4f7fb;
  background:
    radial-gradient(
      circle at 10% 10%,
      rgba(85, 230, 138, 0.12),
      transparent 28%
    ),
    radial-gradient(
      circle at 90% 80%,
      rgba(80, 130, 255, 0.10),
      transparent 30%
    ),
    #070b12;
}

/* =====================================================
   HEADER
===================================================== */

header {
  height: 72px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 28px;
  border-bottom: 1px solid #1e2b3b;
  background: rgba(7, 11, 18, 0.88);
  backdrop-filter: blur(16px);
  position: sticky;
  top: 0;
  z-index: 10;
}

.logo {
  color: #f4f7fb;
  text-decoration: none;
  font-size: 25px;
  font-weight: 900;
  letter-spacing: -1px;
}

.logo span {
  color: #55e68a;
}

.header-right {
  display: flex;
  align-items: center;
  gap: 12px;
}

.username {
  padding: 8px 12px;
  border: 1px solid #263548;
  border-radius: 9px;
  color: #b8c5d5;
  font-size: 13px;
}

.logout {
  border: 1px solid #34465c;
  border-radius: 9px;
  padding: 9px 13px;
  background: #101925;
  color: #dce5ef;
  font: inherit;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
}

.logout:hover {
  background: #182333;
}

/* =====================================================
   MAIN
===================================================== */

main {
  width: min(1150px, calc(100% - 40px));
  margin: 0 auto;
  padding: 65px 0 80px;
}

.hero {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  gap: 30px;
  margin-bottom: 42px;
}

.hero h1 {
  margin: 0;
  font-size: clamp(36px, 6vw, 62px);
  line-height: 1;
  letter-spacing: -3px;
}

.hero h1 span {
  color: #55e68a;
}

.hero p {
  margin: 15px 0 0;
  color: #8291a5;
  font-size: 16px;
  line-height: 1.6;
}

.create-button {
  flex-shrink: 0;
  border: 0;
  border-radius: 12px;
  padding: 14px 20px;
  background: #55e68a;
  color: #07100b;
  font: inherit;
  font-weight: 900;
  cursor: pointer;
  box-shadow:
    0 10px 30px rgba(85, 230, 138, 0.12);
}

.create-button:hover {
  transform: translateY(-2px);
}

/* =====================================================
   SECTION
===================================================== */

.section-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 17px;
}

.section-title h2 {
  margin: 0;
  font-size: 20px;
}

.site-count {
  color: #718096;
  font-size: 13px;
}

/* =====================================================
   SITES
===================================================== */

.sites {
  display: grid;
  grid-template-columns:
    repeat(auto-fill, minmax(280px, 1fr));
  gap: 17px;
}

.site-card {
  min-height: 210px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 23px;
  border: 1px solid #263548;
  border-radius: 18px;
  background: rgba(14, 21, 31, 0.88);
  transition:
    transform 0.18s ease,
    border-color 0.18s ease;
}

.site-card:hover {
  transform: translateY(-3px);
  border-color: #3c536e;
}

.site-icon {
  width: 42px;
  height: 42px;
  display: grid;
  place-items: center;
  border-radius: 11px;
  background: rgba(85, 230, 138, 0.10);
  color: #55e68a;
  font-weight: 900;
  font-size: 18px;
}

.site-name {
  margin: 17px 0 5px;
  font-size: 20px;
  font-weight: 800;
  word-break: break-word;
}

.site-slug {
  color: #708096;
  font-family: Consolas, monospace;
  font-size: 12px;
  word-break: break-all;
}

.site-updated {
  margin-top: 8px;
  color: #5f6e82;
  font-size: 11px;
}

.site-actions {
  display: flex;
  gap: 8px;
  margin-top: 22px;
}

.action {
  flex: 1;
  min-height: 40px;
  border-radius: 9px;
  padding: 9px 10px;
  font: inherit;
  font-size: 12px;
  font-weight: 800;
  cursor: pointer;
}

.open {
  border: 0;
  background: #55e68a;
  color: #07100b;
}

.view {
  border: 1px solid #304258;
  background: #111b28;
  color: #dce5ef;
}

/* =====================================================
   EMPTY
===================================================== */

.empty {
  padding: 65px 25px;
  border: 1px dashed #2c3d52;
  border-radius: 18px;
  text-align: center;
  background: rgba(14, 21, 31, 0.55);
}

.empty-icon {
  font-size: 35px;
  margin-bottom: 14px;
}

.empty h3 {
  margin: 0 0 9px;
  font-size: 20px;
}

.empty p {
  margin: 0 auto 20px;
  max-width: 450px;
  color: #77869a;
  line-height: 1.6;
}

/* =====================================================
   MODAL
===================================================== */

.modal {
  position: fixed;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: rgba(0, 0, 0, 0.65);
  backdrop-filter: blur(7px);
  z-index: 100;
}

.modal.show {
  display: flex;
}

.modal-box {
  width: min(470px, 100%);
  padding: 28px;
  border: 1px solid #2b3d53;
  border-radius: 20px;
  background: #0e151f;
  box-shadow: 0 30px 100px rgba(0, 0, 0, 0.5);
}

.modal-box h2 {
  margin: 0 0 8px;
}

.modal-box p {
  margin: 0 0 24px;
  color: #8190a4;
  line-height: 1.5;
}

label {
  display: block;
  margin-bottom: 7px;
  color: #dce5ef;
  font-size: 13px;
  font-weight: 700;
}

input {
  width: 100%;
  height: 48px;
  margin-bottom: 18px;
  padding: 0 14px;
  border: 1px solid #2a3a4f;
  border-radius: 10px;
  outline: none;
  background: #090f17;
  color: #f4f7fb;
  font: inherit;
}

input:focus {
  border-color: #55e68a;
}

.modal-actions {
  display: flex;
  gap: 9px;
}

.modal-actions button {
  flex: 1;
  min-height: 44px;
  border-radius: 9px;
  font: inherit;
  font-weight: 800;
  cursor: pointer;
}

.cancel {
  border: 1px solid #304258;
  background: #111b28;
  color: #dce5ef;
}

.create {
  border: 0;
  background: #55e68a;
  color: #07100b;
}

/* =====================================================
   STATUS
===================================================== */

.status {
  position: fixed;
  right: 20px;
  bottom: 20px;
  max-width: 360px;
  display: none;
  padding: 13px 16px;
  border: 1px solid #31445b;
  border-radius: 11px;
  background: #101925;
  color: #dce5ef;
  font-size: 13px;
  line-height: 1.4;
  box-shadow: 0 15px 45px rgba(0,0,0,.35);
  z-index: 200;
}

.status.show {
  display: block;
}

/* =====================================================
   LOADING
===================================================== */

.loading {
  padding: 55px;
  text-align: center;
  color: #728197;
}

.spinner {
  width: 28px;
  height: 28px;
  margin: 0 auto 14px;
  border: 3px solid #263548;
  border-top-color: #55e68a;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

/* =====================================================
   RESPONSIVE
===================================================== */

@media (max-width: 700px) {
  header {
    padding: 0 16px;
  }

  .username {
    display: none;
  }

  main {
    width: min(100% - 28px, 1150px);
    padding-top: 40px;
  }

  .hero {
    align-items: stretch;
    flex-direction: column;
  }

  .create-button {
    width: 100%;
  }

  .hero h1 {
    letter-spacing: -2px;
  }
}
</style>
</head>

<body>

<header>

  <a class="logo" href="index.html">
    Planteer<span>.</span>
  </a>

  <div class="header-right">

    <div
      class="username"
      id="username">
      Loading...
    </div>

    <button
      class="logout"
      id="logoutButton">
      Sign Out
    </button>

  </div>

</header>


<main>

  <section class="hero">

    <div>
      <h1>
        Welcome back<span>.</span>
      </h1>

      <p>
        Build, edit, and publish your websites
        with Planteer.
      </p>
    </div>

    <button
      class="create-button"
      id="createButton">
      + Create Website
    </button>

  </section>


  <section>

    <div class="section-title">

      <h2>
        Your Websites
      </h2>

      <div
        class="site-count"
        id="siteCount">
        0 websites
      </div>

    </div>


    <div
      id="siteContainer"
      class="sites">

      <div class="loading">
        <div class="spinner"></div>
        Loading your websites...
      </div>

    </div>

  </section>

</main>


<!-- CREATE SITE MODAL -->

<div
  class="modal"
  id="createModal">

  <div class="modal-box">

    <h2>
      Create a website
    </h2>

    <p>
      Give your new Planteer website a name.
      You can change its files later in the Builder.
    </p>

    <form id="createForm">

      <label for="siteName">
        Website name
      </label>

      <input
        id="siteName"
        name="name"
        type="text"
        placeholder="My Awesome Website"
        maxlength="100"
        autocomplete="off"
        required>

      <label for="siteSlug">
        URL name
      </label>

      <input
        id="siteSlug"
        name="slug"
        type="text"
        placeholder="my-awesome-website"
        maxlength="70"
        autocomplete="off">

      <div class="modal-actions">

        <button
          type="button"
          class="cancel"
          id="cancelCreate">
          Cancel
        </button>

        <button
          type="submit"
          class="create"
          id="submitCreate">
          Create Website
        </button>

      </div>

    </form>

  </div>

</div>


<div
  class="status"
  id="status">
</div>


<script>
/* =====================================================
   CONFIGURATION
===================================================== */

const WORKER =
  "https://planteer.duncanhomeschool.workers.dev";


/* =====================================================
   ELEMENTS
===================================================== */

const usernameElement =
  document.getElementById("username");

const siteContainer =
  document.getElementById("siteContainer");

const siteCount =
  document.getElementById("siteCount");

const createButton =
  document.getElementById("createButton");

const createModal =
  document.getElementById("createModal");

const cancelCreate =
  document.getElementById("cancelCreate");

const createForm =
  document.getElementById("createForm");

const siteName =
  document.getElementById("siteName");

const siteSlug =
  document.getElementById("siteSlug");

const submitCreate =
  document.getElementById("submitCreate");

const logoutButton =
  document.getElementById("logoutButton");

const statusElement =
  document.getElementById("status");


/* =====================================================
   API
===================================================== */

async function api(
  endpoint,
  options = {}
) {
  const response =
    await fetch(
      WORKER + endpoint,
      {
        credentials: "include",
        ...options,
        headers: {
          "Content-Type": "application/json",
          ...(options.headers || {})
        }
      }
    );

  let data;

  try {
    data =
      await response.json();
  } catch {
    data = {
      ok: false,
      error: "Invalid server response."
    };
  }

  if (!response.ok) {
    throw new Error(
      data.error ||
      `Request failed (${response.status})`
    );
  }

  return data;
}


/* =====================================================
   STATUS
===================================================== */

let statusTimer = null;

function showStatus(
  message
) {
  statusElement.textContent =
    message;

  statusElement.classList.add(
    "show"
  );

  clearTimeout(statusTimer);

  statusTimer =
    setTimeout(() => {
      statusElement.classList.remove(
        "show"
      );
    }, 3500);
}


/* =====================================================
   SESSION
===================================================== */

async function loadUser() {
  try {

    const data =
      await api("/api/me");

    if (
      !data.ok ||
      !data.authenticated
    ) {
      window.location.href =
        "signin.html";

      return false;
    }

    const user =
      data.user;

    usernameElement.textContent =
      "@" + (
        user.username ||
        "user"
      );

    return true;

  } catch (error) {

    console.error(
      "Authentication check failed:",
      error
    );

    window.location.href =
      "signin.html";

    return false;
  }
}


/* =====================================================
   LOAD SITES
===================================================== */

async function loadSites() {

  siteContainer.innerHTML = `
    <div class="loading">
      <div class="spinner"></div>
      Loading your websites...
    </div>
  `;

  try {

    const data =
      await api("/api/sites");

    const sites =
      Array.isArray(data.sites)
        ? data.sites
        : [];

    siteCount.textContent =
      `${sites.length} ${
        sites.length === 1
          ? "website"
          : "websites"
      }`;

    if (!sites.length) {

      siteContainer.innerHTML = `
        <div class="empty">

          <div class="empty-icon">
            +
          </div>

          <h3>
            No websites yet
          </h3>

          <p>
            Create your first website and
            start building with Planteer.
          </p>

          <button
            class="create-button"
            id="emptyCreateButton">
            + Create Website
          </button>

        </div>
      `;

      document
        .getElementById("emptyCreateButton")
        .addEventListener(
          "click",
          openCreateModal
        );

      return;
    }

    siteContainer.innerHTML =
      sites
        .map(
          siteCard
        )
        .join("");

    document
      .querySelectorAll(
        "[data-open-site]"
      )
      .forEach(button => {

        button.addEventListener(
          "click",
          () => {

            const id =
              button.dataset.openSite;

            openBuilder(id);
          }
        );

      });

    document
      .querySelectorAll(
        "[data-view-site]"
      )
      .forEach(button => {

        button.addEventListener(
          "click",
          () => {

            const slug =
              button.dataset.viewSite;

            viewSite(slug);
          }
        );

      });

  } catch (error) {

    console.error(
      "Could not load sites:",
      error
    );

    siteContainer.innerHTML = `
      <div class="empty">

        <div class="empty-icon">
          !
        </div>

        <h3>
          Could not load websites
        </h3>

        <p>
          ${escapeHTML(error.message)}
        </p>

        <button
          class="create-button"
          onclick="loadSites()">
          Try Again
        </button>

      </div>
    `;
  }
}


/* =====================================================
   SITE CARD
===================================================== */

function siteCard(
  site
) {

  const updated =
    site.updated_at
      ? formatDate(site.updated_at)
      : "Unknown";

  return `
    <article class="site-card">

      <div>

        <div class="site-icon">
          &lt;/&gt;
        </div>

        <div class="site-name">
          ${escapeHTML(
            site.name ||
            "Untitled Site"
          )}
        </div>

        <div class="site-slug">
          /${escapeHTML(
            site.slug ||
            ""
          )}/
        </div>

        <div class="site-updated">
          Updated ${escapeHTML(updated)}
        </div>

      </div>

      <div class="site-actions">

        <button
          class="action open"
          data-open-site="${Number(site.id)}">
          Open Builder
        </button>

        <button
          class="action view"
          data-view-site="${escapeHTML(site.slug || "")}">
          View
        </button>

      </div>

    </article>
  `;
}


/* =====================================================
   BUILDER
===================================================== */

function openBuilder(
  siteId
) {

  window.location.href =
    `builder.html?site=${encodeURIComponent(
      siteId
    )}`;
}


/* =====================================================
   VIEW SITE
===================================================== */

function viewSite(
  slug
) {

  if (!slug) {
    showStatus(
      "This website does not have a URL slug yet."
    );

    return;
  }

  const base =
    "https://planteer.github.io";

  const url =
    `${base}/${encodeURIComponent(slug)}/`;

  window.open(
    url,
    "_blank",
    "noopener,noreferrer"
  );
}


/* =====================================================
   CREATE MODAL
===================================================== */

function openCreateModal() {

  createModal.classList.add(
    "show"
  );

  siteName.focus();
}


function closeCreateModal() {

  createModal.classList.remove(
    "show"
  );

  createForm.reset();
}


createButton.addEventListener(
  "click",
  openCreateModal
);

cancelCreate.addEventListener(
  "click",
  closeCreateModal
);


createModal.addEventListener(
  "click",
  event => {

    if (
      event.target ===
      createModal
    ) {
      closeCreateModal();
    }

  }
);


/* =====================================================
   AUTO SLUG
===================================================== */

siteName.addEventListener(
  "input",
  () => {

    if (
      siteSlug.dataset.manual === "true"
    ) {
      return;
    }

    siteSlug.value =
      makeSlug(
        siteName.value
      );
  }
);


siteSlug.addEventListener(
  "input",
  () => {

    siteSlug.dataset.manual =
      siteSlug.value.length > 0
        ? "true"
        : "false";

    siteSlug.value =
      makeSlug(
        siteSlug.value
      );
  }
);


/* =====================================================
   CREATE SITE
===================================================== */

createForm.addEventListener(
  "submit",
  async event => {

    event.preventDefault();

    const name =
      siteName.value.trim();

    const slug =
      siteSlug.value.trim();

    if (!name) {

      showStatus(
        "Enter a website name."
      );

      return;
    }

    submitCreate.disabled =
      true;

    submitCreate.textContent =
      "Creating...";

    try {

      const data =
        await api(
          "/api/sites",
          {
            method: "POST",
            body: JSON.stringify({
              name,
              slug: slug || name
            })
          }
        );

      if (
        !data.ok ||
        !data.site
      ) {
        throw new Error(
          data.error ||
          "Website creation failed."
        );
      }

      closeCreateModal();

      showStatus(
        "Website created! Opening Builder..."
      );

      /*
       * Give the Worker a moment to finish
       * the initial GitHub storage writes.
       */

      setTimeout(
        () => {

          openBuilder(
            data.site.id
          );

        },
        350
      );

    } catch (error) {

      console.error(
        "Create site failed:",
        error
      );

      showStatus(
        error.message ||
        "Could not create website."
      );

    } finally {

      submitCreate.disabled =
        false;

      submitCreate.textContent =
        "Create Website";
    }

  }
);


/* =====================================================
   LOGOUT
===================================================== */

logoutButton.addEventListener(
  "click",
  async () => {

    logoutButton.disabled =
      true;

    logoutButton.textContent =
      "Signing out...";

    try {

      await api(
        "/api/logout",
        {
          method: "POST",
          body: "{}"
        }
      );

    } catch (error) {

      console.error(
        "Logout error:",
        error
      );

    }

    window.location.href =
      "signin.html";
  }
);


/* =====================================================
   SLUG
===================================================== */

function makeSlug(
  value
) {

  return String(value || "")
    .toLowerCase()
    .trim()
    .replace(
      /[^a-z0-9]+/g,
      "-"
    )
    .replace(
      /^-+|-+$/g,
      ""
    )
    .slice(0, 70);
}


/* =====================================================
   DATE
===================================================== */

function formatDate(
  value
) {

  const date =
    new Date(value);

  if (
    Number.isNaN(
      date.getTime()
    )
  ) {
    return value;
  }

  return date.toLocaleDateString(
    undefined,
    {
      year: "numeric",
      month: "short",
      day: "numeric"
    }
  );
}


/* =====================================================
   HTML ESCAPING
===================================================== */

function escapeHTML(
  value
) {

  return String(value ?? "")
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );
}


/* =====================================================
   START
===================================================== */

async function start() {

  const authenticated =
    await loadUser();

  if (!authenticated) {
    return;
  }

  await loadSites();
}


start();
</script>

</body>
</html>
