<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Planteer</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
      background: #f4f4f4;
    }

    input,
    textarea,
    button {
      font-family: inherit;
      box-sizing: border-box;
    }

    input {
      width: 100%;
      padding: 10px;
      margin: 8px 0 15px;
    }

    textarea {
      width: 100%;
      height: 350px;
      padding: 12px;
      resize: vertical;
      font-family: monospace;
      font-size: 14px;
    }

    button {
      padding: 10px 16px;
      margin: 5px 5px 5px 0;
      cursor: pointer;
    }

    #result {
      white-space: pre-wrap;
      background: white;
      padding: 15px;
      margin-top: 20px;
      border: 1px solid #ccc;
    }
  </style>
</head>

<body>

  <h1>Planteer</h1>
  <p>Guacamole Hosting</p>

  <h2>Website Editor</h2>

  <label>Website ID</label>

  <input
    id="websiteId"
    type="number"
    placeholder="Example: 1"
  >

  <h3>index.html</h3>

  <textarea id="htmlEditor"><!DOCTYPE html>
<html>
<head>
  <title>My Planteer Site</title>
</head>

<body>

  <h1>Hello from Planteer!</h1>

  <p>This website is hosted by Guacamole.</p>

</body>
</html></textarea>

  <br>

  <button id="saveButton">
    Save index.html
  </button>

  <button id="loadButton">
    Load Files
  </button>

  <button id="publishButton">
    Publish Website
  </button>

  <div id="result">
    Ready.
  </div>


  <script>

    const API =
      "https://hard-planet-hosting.josiahdduncan.workers.dev";


    const websiteId =
      document.getElementById("websiteId");

    const htmlEditor =
      document.getElementById("htmlEditor");

    const saveButton =
      document.getElementById("saveButton");

    const loadButton =
      document.getElementById("loadButton");

    const publishButton =
      document.getElementById("publishButton");

    const result =
      document.getElementById("result");


    /*
    ==========================================
    SAVE FILE
    ==========================================
    */

    saveButton.addEventListener("click", async () => {

      const id =
        Number(websiteId.value);

      if (!id) {

        result.textContent =
          "Enter a website ID first.";

        return;
      }


      result.textContent =
        "Saving index.html...";


      try {

        const response =
          await fetch(
            API + "/api/files",
            {
              method: "POST",

              headers: {
                "Content-Type": "application/json"
              },

              body: JSON.stringify({
                website_id: id,
                path: "index.html",
                content: htmlEditor.value,
                content_type: "text/html"
              })
            }
          );


        const data =
          await response.json();


        result.textContent =
          JSON.stringify(
            data,
            null,
            2
          );


      } catch (error) {

        result.textContent =
          "Save failed:\n" +
          error.message;

      }

    });


    /*
    ==========================================
    LOAD FILES
    ==========================================
    */

    loadButton.addEventListener("click", async () => {

      const id =
        Number(websiteId.value);

      if (!id) {

        result.textContent =
          "Enter a website ID first.";

        return;
      }


      result.textContent =
        "Loading files...";


      try {

        const response =
          await fetch(
            API +
            "/api/files?website_id=" +
            encodeURIComponent(id)
          );


        const data =
          await response.json();


        result.textContent =
          JSON.stringify(
            data,
            null,
            2
          );


        if (
          data.files &&
          data.files.length > 0
        ) {

          const indexFile =
            data.files.find(
              file =>
                file.path === "index.html"
            );


          if (indexFile) {

            htmlEditor.value =
              indexFile.content;

          }

        }


      } catch (error) {

        result.textContent =
          "Load failed:\n" +
          error.message;

      }

    });


    /*
    ==========================================
    PUBLISH
    ==========================================
    */

    publishButton.addEventListener("click", async () => {

      const id =
        Number(websiteId.value);

      if (!id) {

        result.textContent =
          "Enter a website ID first.";

        return;
      }


      result.textContent =
        "Publishing...";


      try {

        const response =
          await fetch(
            API +
            "/api/websites/" +
            id +
            "/publish",
            {
              method: "POST"
            }
          );


        const data =
          await response.json();


        result.textContent =
          JSON.stringify(
            data,
            null,
            2
          );


      } catch (error) {

        result.textContent =
          "Publish failed:\n" +
          error.message;

      }

    });

  </script>

</body>
</html>
