<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Planteer Editor</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      color: #111;
    }

    header {
      background: #111;
      color: white;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    header h1 {
      margin: 0;
      font-size: 21px;
    }

    header button {
      margin: 0;
    }

    main {
      max-width: 1400px;
      margin: 20px auto;
      padding: 0 15px;
    }

    .site-info {
      background: white;
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 15px;
    }

    .site-info h2 {
      margin: 0 0 5px;
    }

    .workspace {
      display: grid;
      grid-template-columns: 250px 1fr;
      gap: 15px;
    }

    .files {
      background: white;
      border: 1px solid #ccc;
      border-radius: 8px;
      overflow: hidden;
      min-height: 600px;
    }

    .files-header {
      padding: 13px;
      border-bottom: 1px solid #ccc;
      font-weight: bold;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .files-header button {
      padding: 5px 9px;
      margin: 0;
    }

    #fileList {
      padding: 5px;
    }

    .file {
      width: 100%;
      text-align: left;
      padding: 10px;
      margin: 2px 0;
      border: 0;
      border-radius: 5px;
      background: transparent;
      cursor: pointer;
      font-family: Consolas, monospace;
    }

    .file:hover {
      background: #eee;
    }

    .file.active {
      background: #ddd;
      font-weight: bold;
    }

    .editor-panel {
      min-width: 0;
    }

    .editor-title {
      background: white;
      border: 1px solid #ccc;
      border-radius: 8px 8px 0 0;
      padding: 12px 15px;
      font-family: Consolas, monospace;
      font-weight: bold;
    }

    textarea {
      display: block;
      width: 100%;
      min-height: 600px;
      resize: vertical;

      padding: 15px;

      border: 1px solid #333;
      border-top: 0;
      border-radius: 0 0 8px 8px;

      background: #111;
      color: white;

      font-family: Consolas, Monaco, monospace;
      font-size: 14px;
      line-height: 1.5;
      tab-size: 2;
    }

    .buttons {
      margin-top: 12px;
    }

    button {
      padding: 9px 14px;
      margin-right: 6px;
      margin-bottom: 6px;
      cursor: pointer;
      border: 1px solid #999;
      border-radius: 5px;
      background: white;
    }

    button:hover {
      background: #e8e8e8;
    }

    .primary {
      background: #111;
      color: white;
      border-color: #111;
    }

    .primary:hover {
      background: #333;
    }

    .danger {
      color: #b00020;
    }

    #status {
      background: white;
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 12px;
      margin-top: 12px;
      white-space: pre-wrap;
    }

    .success {
      color: green;
    }

    .error {
      color: #b00020;
    }

    .empty {
      color: #777;
      padding: 15px;
      font-size: 14px;
    }

    @media (max-width: 750px) {
      .workspace {
        grid-template-columns: 1fr;
      }

      .files {
        min-height: auto;
      }

      #fileList {
        max-height: 220px;
        overflow-y: auto;
      }

      textarea {
        min-height: 450px;
      }
    }
  </style>
</head>

<body>

<header>

  <h1>Planteer Editor</h1>

  <button id="dashboardButton">
    Dashboard
  </button>

</header>


<main>

  <div class="site-info">

    <h2 id="siteName">
      Loading website...
    </h2>

    <div id="siteID">
      Website ID: loading...
    </div>

  </div>


  <div class="workspace">

    <!-- FILE LIST -->

    <aside class="files">

      <div class="files-header">

        <span>Files</span>

        <button id="newFileButton">
          +
        </button>

      </div>

      <div id="fileList">
        Loading files...
      </div>

    </aside>


    <!-- CODE EDITOR -->

    <section class="editor-panel">

      <div
        class="editor-title"
        id="editorTitle"
      >
        No file selected
      </div>

      <textarea
        id="editor"
        spellcheck="false"
        placeholder="Select a file..."
      ></textarea>


      <div class="buttons">

        <button
          id="saveButton"
          class="primary"
        >
          Save File
        </button>

        <button
          id="newFileButton2"
        >
          New File
        </button>

        <button
          id="publishButton"
        >
          Publish
        </button>

        <button
          id="openButton"
        >
          Open Website
        </button>

        <button
          id="deleteButton"
          class="danger"
        >
          Delete File
        </button>

      </div>


      <div id="status">
        Starting editor...
      </div>

    </section>

  </div>

</main>


<script>

  /*
  ==========================================
  CONFIGURATION
  ==========================================
  */

  const API =
    "https://hard-planet-hosting.josiahdduncan.workers.dev";


  /*
  ==========================================
  ELEMENTS
  ==========================================
  */

  const siteName =
    document.getElementById("siteName");

  const siteID =
    document.getElementById("siteID");

  const fileList =
    document.getElementById("fileList");

  const editor =
    document.getElementById("editor");

  const editorTitle =
    document.getElementById("editorTitle");

  const status =
    document.getElementById("status");

  const saveButton =
    document.getElementById("saveButton");

  const newFileButton =
    document.getElementById("newFileButton");

  const newFileButton2 =
    document.getElementById("newFileButton2");

  const publishButton =
    document.getElementById("publishButton");

  const openButton =
    document.getElementById("openButton");

  const deleteButton =
    document.getElementById("deleteButton");

  const dashboardButton =
    document.getElementById("dashboardButton");


  /*
  ==========================================
  GET WEBSITE ID
  ==========================================
  */

  const params =
    new URLSearchParams(
      window.location.search
    );

  const websiteId =
    Number(
      params.get("website")
    );


  /*
  ==========================================
  CURRENT STATE
  ==========================================
  */

  let website = null;
  let files = [];
  let currentFile = null;


  /*
  ==========================================
  STATUS
  ==========================================
  */

  function setStatus(
    message,
    type = ""
  ) {

    status.textContent =
      message;

    status.className =
      type;

  }


  /*
  ==========================================
  LOAD WEBSITE
  ==========================================
  */

  async function loadWebsite() {

    if (
      !Number.isInteger(
        websiteId
      ) ||
      websiteId <= 0
    ) {

      setStatus(
        "No valid website ID was provided.",
        "error"
      );

      editor.disabled = true;

      return;

    }


    try {

      setStatus(
        "Loading website..."
      );


      const response =
        await fetch(
          API + "/api/websites"
        );


      const data =
        await response.json();


      if (!response.ok) {

        throw new Error(
          data.error ||
          "Could not load websites."
        );

      }


      website =
        data.websites.find(
          item =>
            Number(item.id) ===
            websiteId
        );


      if (!website) {

        throw new Error(
          "Website not found."
        );

      }


      siteName.textContent =
        website.site_name;

      siteID.textContent =
        "Website ID: " +
        website.id;


      await loadFiles();


    } catch (error) {

      setStatus(
        "Error:\n" +
        error.message,
        "error"
      );

    }

  }


  /*
  ==========================================
  LOAD FILES
  ==========================================
  */

  async function loadFiles() {

    setStatus(
      "Loading files..."
    );


    try {

      const response =
        await fetch(
          API +
          "/api/files?website_id=" +
          encodeURIComponent(
            websiteId
          )
        );


      const data =
        await response.json();


      if (!response.ok) {

        throw new Error(
          data.error ||
          "Could not load files."
        );

      }


      files =
        data.files || [];


      renderFileList();


      /*
      Automatically select index.html
      if it exists.
      */

      const indexFile =
        files.find(
          file =>
            file.path ===
            "index.html"
        );


      if (indexFile) {

        selectFile(
          indexFile.id
        );

      } else if (
        files.length > 0
      ) {

        selectFile(
          files[0].id
        );

      } else {

        currentFile = null;

        editorTitle.textContent =
          "No file selected";

        editor.value = "";

        setStatus(
          "No files yet. Click + New File to create one."
        );

      }


    } catch (error) {

      setStatus(
        "Error loading files:\n" +
        error.message,
        "error"
      );

    }

  }


  /*
  ==========================================
  RENDER FILE LIST
  ==========================================
  */

  function renderFileList() {

    fileList.innerHTML = "";


    if (files.length === 0) {

      fileList.innerHTML = `
        <div class="empty">
          No files yet.
        </div>
      `;

      return;

    }


    /*
    Sort index.html first.
    */

    const sortedFiles =
      [...files].sort(
        (a, b) => {

          if (
            a.path ===
            "index.html"
          ) {
            return -1;
          }

          if (
            b.path ===
            "index.html"
          ) {
            return 1;
          }

          return a.path.localeCompare(
            b.path
          );

        }
      );


    for (
      const file of sortedFiles
    ) {

      const button =
        document.createElement(
          "button"
        );


      button.className =
        "file";


      if (
        currentFile &&
        currentFile.id ===
        file.id
      ) {

        button.classList.add(
          "active"
        );

      }


      button.textContent =
        file.path;


      button.addEventListener(
        "click",
        () => {

          selectFile(
            file.id
          );

        }
      );


      fileList.appendChild(
        button
      );

    }

  }


  /*
  ==========================================
  SELECT FILE
  ==========================================
  */

  function selectFile(fileId) {

    const file =
      files.find(
        item =>
          Number(item.id) ===
          Number(fileId)
      );


    if (!file) {
      return;
    }


    currentFile =
      file;


    editorTitle.textContent =
      file.path;


    editor.value =
      file.content || "";


    renderFileList();


    setStatus(
      "Editing " +
      file.path
    );

  }


  /*
  ==========================================
  NEW FILE
  ==========================================
  */

  async function createNewFile() {

    const path =
      prompt(
        "Enter the new file path:\n\nExamples:\nindex.html\nabout.html\nstyle.css\nscript.js\nimages/logo.txt"
      );


    if (
      path === null
    ) {

      return;

    }


    const cleanPath =
      path.trim();


    if (!cleanPath) {

      alert(
        "A file path is required."
      );

      return;

    }


    if (
      cleanPath.includes("..") ||
      cleanPath.startsWith("/")
    ) {

      alert(
        "Invalid file path."
      );

      return;

    }


    /*
    Don't accidentally create
    the same file twice.
    */

    const existing =
      files.find(
        file =>
          file.path ===
          cleanPath
      );


    if (existing) {

      selectFile(
        existing.id
      );

      return;

    }


    const contentType =
      getContentType(
        cleanPath
      );


    setStatus(
      "Creating " +
      cleanPath +
      "..."
    );


    try {

      const response =
        await fetch(
          API + "/api/files",
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify({

                website_id:
                  websiteId,

                path:
                  cleanPath,

                content:
                  getStarterContent(
                    cleanPath
                  ),

                content_type:
                  contentType

              })

          }
        );


      const data =
        await response.json();


      if (!response.ok) {

        throw new Error(
          data.error ||
          "Could not create file."
        );

      }


      await loadFiles();


      /*
      Select the newly created file.
      */

      const newFile =
        files.find(
          file =>
            file.path ===
            cleanPath
        );


      if (newFile) {

        selectFile(
          newFile.id
        );

      }


      setStatus(
        "Created " +
        cleanPath,
        "success"
      );


    } catch (error) {

      setStatus(
        "Could not create file:\n" +
        error.message,
        "error"
      );

    }

  }


  /*
  ==========================================
  SAVE CURRENT FILE
  ==========================================
  */

  async function saveFile() {

    if (!currentFile) {

      alert(
        "Select a file first."
      );

      return;

    }


    setStatus(
      "Saving " +
      currentFile.path +
      "..."
    );


    try {

      const response =
        await fetch(
          API + "/api/files",
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify({

                website_id:
                  websiteId,

                path:
                  currentFile.path,

                content:
                  editor.value,

                content_type:
                  currentFile.content_type ||
                  getContentType(
                    currentFile.path
                  )

              })

          }
        );


      const data =
        await response.json();


      if (!response.ok) {

        throw new Error(
          data.error ||
          "Save failed."
        );

      }


      currentFile.content =
        editor.value;


      setStatus(
        "Saved " +
        currentFile.path +
        " successfully.",
        "success"
      );


    } catch (error) {

      setStatus(
        "Save failed:\n" +
        error.message,
        "error"
      );

    }

  }


  /*
  ==========================================
  PUBLISH
  ==========================================
  */

  async function publishWebsite() {

    /*
    Save the currently open file first.
    */

    if (currentFile) {

      await saveFile();

    }


    setStatus(
      "Publishing..."
    );


    try {

      const response =
        await fetch(
          API +
          "/api/websites/" +
          websiteId +
          "/publish",
          {
            method: "POST"
          }
        );


      const data =
        await response.json();


      if (!response.ok) {

        throw new Error(
          data.error ||
          "Publish failed."
        );

      }


      setStatus(

        "Published successfully!\n\n" +

        "Live URL:\n" +

        API +
        "/site/" +
        encodeURIComponent(
          data.website.site_name
        ) +
        "/",

        "success"

      );


    } catch (error) {

      setStatus(
        "Publish failed:\n" +
        error.message,
        "error"
      );

    }

  }


  /*
  ==========================================
  OPEN WEBSITE
  ==========================================
  */

  function openWebsite() {

    if (!website) {

      return;

    }


    window.open(

      API +
      "/site/" +
      encodeURIComponent(
        website.site_name
      ) +
      "/",

      "_blank"

    );

  }


  /*
  ==========================================
  DELETE FILE
  ==========================================
  */

  async function deleteFile() {

    if (!currentFile) {

      alert(
        "Select a file first."
      );

      return;

    }


    /*
    Don't allow index.html
    to be deleted for now.
    */

    if (
      currentFile.path ===
      "index.html"
    ) {

      alert(
        "index.html cannot be deleted because every published website needs it."
      );

      return;

    }


    const confirmed =
      confirm(
        "Delete " +
        currentFile.path +
        "?"
      );


    if (!confirmed) {

      return;

    }


    /*
    NOTE:
    The current Worker does not yet
    have a DELETE /api/files endpoint.

    We will add that next.
    */

    alert(
      "File deletion is not available yet. We'll add it to the Worker next."
    );

  }


  /*
  ==========================================
  CONTENT TYPES
  ==========================================
  */

  function getContentType(path) {

    const lower =
      path.toLowerCase();


    if (
      lower.endsWith(
        ".html"
      )
    ) {

      return "text/html";

    }


    if (
      lower.endsWith(
        ".css"
      )
    ) {

      return "text/css";

    }


    if (
      lower.endsWith(
        ".js"
      )
    ) {

      return "application/javascript";

    }


    if (
      lower.endsWith(
        ".json"
      )
    ) {

      return "application/json";

    }


    if (
      lower.endsWith(
        ".svg"
      )
    ) {

      return "image/svg+xml";

    }


    if (
      lower.endsWith(
        ".txt"
      )
    ) {

      return "text/plain";

    }


    return "text/plain";

  }


  /*
  ==========================================
  STARTER CONTENT
  ==========================================
  */

  function getStarterContent(path) {

    const lower =
      path.toLowerCase();


    if (
      lower.endsWith(
        ".html"
      )
    ) {

      return `<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Planteer Site</title>
</head>
<body>

  <h1>Hello from Planteer!</h1>

</body>
</html>`;

    }


    if (
      lower.endsWith(
        ".css"
      )
    ) {

      return `/* Planteer stylesheet */

body {
  font-family: Arial, sans-serif;
}`;

    }


    if (
      lower.endsWith(
        ".js"
      )
    ) {

      return `// Planteer JavaScript

console.log("Hello from Planteer!");`;

    }


    if (
      lower.endsWith(
        ".json"
      )
    ) {

      return `{
  "hello": "Planteer"
}`;

    }


    return "";

  }


  /*
  ==========================================
  BUTTONS
  ==========================================
  */

  newFileButton.addEventListener(
    "click",
    createNewFile
  );


  newFileButton2.addEventListener(
    "click",
    createNewFile
  );


  saveButton.addEventListener(
    "click",
    saveFile
  );


  publishButton.addEventListener(
    "click",
    publishWebsite
  );


  openButton.addEventListener(
    "click",
    openWebsite
  );


  deleteButton.addEventListener(
    "click",
    deleteFile
  );


  dashboardButton.addEventListener(
    "click",
    () => {

      window.location.href =
        "dashboard.html";

    }
  );


  /*
  ==========================================
  START
  ==========================================
  */

  loadWebsite();

</script>

</body>
</html>
