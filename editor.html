<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planteer Editor</title>

<style>
:root {
    --bg: #070b12;
    --panel: #0d131d;
    --panel2: #111a26;
    --border: #243244;
    --text: #edf4ff;
    --muted: #8da0b7;
    --green: #35ff88;
    --green2: #18c969;
    --blue: #4ca7ff;
    --red: #ff5570;
}

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: Segoe UI, Arial, sans-serif;
}

button,
input,
textarea {
    font: inherit;
}

button {
    cursor: pointer;
}

.app {
    display: grid;
    grid-template-rows: 58px 1fr;
    width: 100%;
    height: 100vh;
}

/* HEADER */

.header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 0 18px;
    background: #090e16;
    border-bottom: 1px solid var(--border);
}

.logo {
    display: flex;
    align-items: center;
    gap: 9px;
    font-weight: 800;
    letter-spacing: 1px;
    color: var(--green);
    white-space: nowrap;
}

.logo-mark {
    width: 28px;
    height: 28px;
    display: grid;
    place-items: center;
    border: 1px solid var(--green);
    border-radius: 7px;
    font-weight: 900;
}

.planteer-site {
    color: var(--muted);
    font-size: 13px;
}

.filename {
    flex: 1;
    min-width: 0;
    text-align: center;
    color: white;
    font-weight: 700;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.header-actions {
    display: flex;
    gap: 7px;
}

.btn {
    border: 1px solid var(--border);
    background: var(--panel2);
    color: var(--text);
    border-radius: 7px;
    padding: 7px 11px;
    transition: 0.15s;
}

.btn:hover {
    border-color: #3b5069;
    background: #172231;
}

.btn.green {
    border-color: var(--green2);
    color: var(--green);
}

.btn.blue {
    border-color: #2869a8;
    color: #7bc0ff;
}

.btn.red {
    border-color: #71303c;
    color: #ff8194;
}

/* MAIN */

.main {
    display: grid;
    grid-template-columns: 230px minmax(350px, 1fr) minmax(350px, 45%);
    min-height: 0;
}

/* SIDEBAR */

.sidebar {
    min-width: 0;
    background: #090e16;
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
}

.sidebar-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 13px;
    border-bottom: 1px solid var(--border);
    color: var(--muted);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.file-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
}

.file {
    display: flex;
    align-items: center;
    gap: 9px;
    width: 100%;
    padding: 10px;
    margin-bottom: 4px;
    border: 1px solid transparent;
    border-radius: 7px;
    background: transparent;
    color: var(--text);
    text-align: left;
}

.file:hover {
    background: #111a26;
}

.file.active {
    background: #12251b;
    border-color: #1d7042;
}

.file-icon {
    width: 24px;
    text-align: center;
}

.file-name {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.sidebar-bottom {
    padding: 10px;
    border-top: 1px solid var(--border);
}

.new-file {
    width: 100%;
}

/* EDITOR */

.editor-panel {
    min-width: 0;
    display: flex;
    flex-direction: column;
    background: #080d14;
}

.editor-toolbar {
    height: 46px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 6px 10px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
}

.editor-language {
    margin-left: auto;
    color: var(--muted);
    font-size: 12px;
}

.editor-wrap {
    position: relative;
    flex: 1;
    min-height: 0;
}

#lineNumbers {
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 52px;
    padding: 14px 8px;
    overflow: hidden;
    background: #090e15;
    border-right: 1px solid #182330;
    color: #52657c;
    font: 14px/1.55 Consolas, monospace;
    text-align: right;
    user-select: none;
    white-space: pre;
}

#codeEditor {
    position: absolute;
    left: 52px;
    top: 0;
    width: calc(100% - 52px);
    height: 100%;
    resize: none;
    outline: none;
    border: 0;
    padding: 14px;
    background: #080d14;
    color: #e4edf8;
    font: 14px/1.55 Consolas, "Courier New", monospace;
    tab-size: 4;
    white-space: pre;
    overflow: auto;
}

#codeEditor::selection {
    background: #245c3d;
}

.statusbar {
    height: 27px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 15px;
    padding: 0 10px;
    background: #0c131d;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: 11px;
}

/* PREVIEW */

.preview-panel {
    min-width: 0;
    display: flex;
    flex-direction: column;
    background: #060a10;
    border-left: 1px solid var(--border);
}

.preview-toolbar {
    height: 46px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 10px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
}

.preview-title {
    font-weight: 700;
}

.preview-address {
    flex: 1;
    min-width: 0;
    height: 31px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: #080d14;
    color: var(--muted);
    padding: 0 9px;
    font-size: 12px;
}

.preview-wrap {
    position: relative;
    flex: 1;
    min-height: 0;
    background: white;
}

#preview {
    width: 100%;
    height: 100%;
    display: block;
    border: 0;
    background: white;
}

/* MODAL */

.modal-backdrop {
    position: fixed;
    inset: 0;
    display: none;
    place-items: center;
    background: rgba(0, 0, 0, 0.72);
    z-index: 100;
}

.modal-backdrop.show {
    display: grid;
}

.modal {
    width: min(430px, calc(100vw - 30px));
    padding: 20px;
    background: #0d141e;
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: 0 20px 80px #000;
}

.modal h2 {
    margin: 0 0 15px;
    font-size: 18px;
}

.modal input {
    width: 100%;
    height: 40px;
    padding: 0 10px;
    border: 1px solid var(--border);
    border-radius: 7px;
    outline: none;
    background: #080d14;
    color: white;
}

.modal input:focus {
    border-color: var(--green2);
}

.modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 15px;
}

/* TOAST */

.toast {
    position: fixed;
    right: 18px;
    bottom: 18px;
    padding: 11px 15px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #101923;
    color: white;
    box-shadow: 0 10px 30px #0008;
    transform: translateY(80px);
    opacity: 0;
    transition: 0.2s;
    pointer-events: none;
    z-index: 200;
}

.toast.show {
    transform: translateY(0);
    opacity: 1;
}

.toast.success {
    border-color: #247c4b;
}

.toast.error {
    border-color: #873344;
}

/* RESPONSIVE */

@media (max-width: 950px) {
    .main {
        grid-template-columns: 190px 1fr;
    }

    .preview-panel {
        display: none;
    }
}

@media (max-width: 650px) {
    .main {
        grid-template-columns: 1fr;
    }

    .sidebar {
        display: none;
    }

    .planteer-site {
        display: none;
    }
}
</style>
</head>

<body>

<div class="app">

<header class="header">

    <div class="logo">
        <div class="logo-mark">P</div>
        PLANTEER
    </div>

    <div class="planteer-site">
        planteer.com
    </div>

    <div class="filename" id="currentFilename">
        index.html
    </div>

    <div class="header-actions">
        <button class="btn" id="saveBtn">Save</button>
        <button class="btn blue" id="previewBtn">Preview</button>
        <button class="btn green" id="downloadBtn">Download</button>
    </div>

</header>

<main class="main">

<aside class="sidebar">

    <div class="sidebar-title">
        <span>Files</span>
        <span id="fileCount">0</span>
    </div>

    <div class="file-list" id="fileList"></div>

    <div class="sidebar-bottom">
        <button class="btn green new-file" id="newFileBtn">
            + New File
        </button>
    </div>

</aside>

<section class="editor-panel">

    <div class="editor-toolbar">

        <button class="btn" id="undoBtn">
            Undo
        </button>

        <button class="btn" id="redoBtn">
            Redo
        </button>

        <button class="btn" id="formatBtn">
            Format
        </button>

        <button class="btn" id="clearBtn">
            Clear
        </button>

        <span class="editor-language" id="language">
            HTML
        </span>

    </div>

    <div class="editor-wrap">

        <div id="lineNumbers">1</div>

        <textarea
            id="codeEditor"
            spellcheck="false"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="off"
        ></textarea>

    </div>

    <div class="statusbar">

        <span id="statusText">
            Ready
        </span>

        <span id="cursorPosition">
            Ln 1, Col 1
        </span>

        <span id="charCount">
            0 characters
        </span>

    </div>

</section>

<section class="preview-panel">

    <div class="preview-toolbar">

        <span class="preview-title">
            Preview
        </span>

        <input
            class="preview-address"
            id="previewAddress"
            value="planteer.com/mysitehere/index.html"
            readonly
        >

        <button class="btn" id="refreshPreviewBtn">
            ↻
        </button>

        <button class="btn" id="openPreviewBtn">
            Open
        </button>

    </div>

    <div class="preview-wrap">

        <iframe
            id="preview"
            title="Planteer Preview"
            sandbox="allow-scripts allow-forms allow-modals"
        ></iframe>

    </div>

</section>

</main>
</div>

<!-- NEW FILE MODAL -->

<div class="modal-backdrop" id="newFileModal">

    <div class="modal">

        <h2>Create New File</h2>

        <input
            id="newFileInput"
            type="text"
            placeholder="example.html"
            autocomplete="off"
        >

        <div class="modal-actions">

            <button class="btn" id="cancelNewFile">
                Cancel
            </button>

            <button class="btn green" id="createNewFile">
                Create
            </button>

        </div>

    </div>

</div>

<div class="toast" id="toast"></div>

<script>
"use strict";

/*
==========================================================
PLANTEER EDITOR
==========================================================

Authentication:
----------------------------------------------------------
This page DOES NOT have its own GitHub login.

The intended authentication flow is:

    Planteer login page
            ↓
       GitHub OAuth
            ↓
    Planteer session cookie
            ↓
    This editor page

The browser handles the session cookie.

This editor should therefore NOT repeatedly ask the
user to sign in.

For future Planteer API requests, use:

    fetch("/api/...", {
        credentials: "include"
    });

Do NOT attempt to read an HttpOnly session cookie
with document.cookie.

Site path:
----------------------------------------------------------

    planteer.com/mysitehere/

Files are displayed as:

    planteer.com/mysitehere/index.html
    planteer.com/mysitehere/style.css
    planteer.com/mysitehere/script.js

No Cloudflare URL is used in the UI.
==========================================================
*/

const PLANTEER_SITE_PATH =
    "planteer.com/mysitehere/";


const STORAGE_KEY =
    "planteer_editor_files_v2";


const defaultFiles = {

    "index.html": `<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Planteer Site</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <main>

        <h1>Welcome to My Planteer Site</h1>

        <p>
            Your Planteer preview is working.
        </p>

        <button id="testButton">
            Test Planteer
        </button>

        <p id="output"></p>

    </main>

    <script src="script.js"><\/script>

</body>
</html>`,

    "about.html": `<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>About My Site</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <main>

        <h1>About</h1>

        <p>
            This is another page in my Planteer website.
        </p>

    </main>

</body>
</html>`,

    "style.css": `body {

    margin: 0;

    min-height: 100vh;

    display: grid;

    place-items: center;

    background: #07100b;

    color: white;

    font-family: Arial, sans-serif;

}

main {

    width: min(700px, 90%);

    padding: 40px;

    text-align: center;

    border: 1px solid #35ff88;

    border-radius: 18px;

    background: #0d1710;

}

h1 {

    color: #35ff88;

}

button {

    padding: 10px 16px;

    border: 1px solid #35ff88;

    border-radius: 8px;

    background: #12251a;

    color: #35ff88;

    cursor: pointer;

}

button:hover {

    background: #183a25;

}`,

    "script.js": `const button =
    document.getElementById("testButton");

const output =
    document.getElementById("output");

if (button) {

    button.addEventListener("click", () => {

        if (output) {

            output.textContent =
                "Planteer JavaScript is working.";

        }

    });

}`
};


let files = loadFiles();

let currentFile = "index.html";

let history = [];

let historyIndex = -1;


/* ========================================================
   DOM
======================================================== */

const codeEditor =
    document.getElementById("codeEditor");

const fileList =
    document.getElementById("fileList");

const currentFilename =
    document.getElementById("currentFilename");

const lineNumbers =
    document.getElementById("lineNumbers");

const language =
    document.getElementById("language");

const fileCount =
    document.getElementById("fileCount");

const statusText =
    document.getElementById("statusText");

const cursorPosition =
    document.getElementById("cursorPosition");

const charCount =
    document.getElementById("charCount");

const preview =
    document.getElementById("preview");

const previewAddress =
    document.getElementById("previewAddress");

const toast =
    document.getElementById("toast");

const newFileModal =
    document.getElementById("newFileModal");

const newFileInput =
    document.getElementById("newFileInput");


/* ========================================================
   STORAGE
======================================================== */

function loadFiles() {

    try {

        const saved =
            localStorage.getItem(STORAGE_KEY);

        if (!saved) {

            return {
                ...defaultFiles
            };

        }

        const parsed =
            JSON.parse(saved);

        if (
            !parsed ||
            typeof parsed !== "object" ||
            Object.keys(parsed).length === 0
        ) {

            return {
                ...defaultFiles
            };

        }

        return parsed;

    } catch (error) {

        console.error(
            "Could not load Planteer files:",
            error
        );

        return {
            ...defaultFiles
        };

    }
}


function saveFiles() {

    try {

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(files)
        );

        setStatus("Saved locally");

    } catch (error) {

        console.error(error);

        showToast(
            "Could not save files.",
            "error"
        );

    }
}


/* ========================================================
   FILE ICONS
======================================================== */

function getFileIcon(filename) {

    const ext =
        filename
            .split(".")
            .pop()
            .toLowerCase();

    if (
        ext === "html" ||
        ext === "htm"
    ) {

        return "🌐";

    }

    if (ext === "css") {

        return "🎨";

    }

    if (ext === "js") {

        return "⚡";

    }

    if (
        ext === "png" ||
        ext === "jpg" ||
        ext === "jpeg" ||
        ext === "gif" ||
        ext === "webp" ||
        ext === "svg"
    ) {

        return "🖼";

    }

    if (ext === "json") {

        return "⚙";

    }

    return "📄";
}


/* ========================================================
   FILE PATH
======================================================== */

function getPlanteerPath(filename) {

    return PLANTEER_SITE_PATH + filename;

}


/* ========================================================
   FILE LIST
======================================================== */

function renderFileList() {

    fileList.innerHTML = "";

    const names =
        Object.keys(files).sort((a, b) => {

            if (a === "index.html") {

                return -1;

            }

            if (b === "index.html") {

                return 1;

            }

            return a.localeCompare(b);

        });

    fileCount.textContent =
        names.length;

    for (const filename of names) {

        const button =
            document.createElement("button");

        button.className = "file";

        if (filename === currentFile) {

            button.classList.add("active");

        }

        const icon =
            document.createElement("span");

        icon.className =
            "file-icon";

        icon.textContent =
            getFileIcon(filename);

        const name =
            document.createElement("span");

        name.className =
            "file-name";

        name.textContent =
            filename;

        button.appendChild(icon);

        button.appendChild(name);

        button.addEventListener(
            "click",
            () => {

                switchFile(filename);

            }
        );

        fileList.appendChild(button);

    }
}


/* ========================================================
   SWITCH FILE
======================================================== */

function switchFile(filename) {

    if (!(filename in files)) {

        return;

    }

    saveCurrentEditor();

    currentFile =
        filename;

    codeEditor.value =
        files[currentFile];

    currentFilename.textContent =
        currentFile;

    previewAddress.value =
        getPlanteerPath(currentFile);

    language.textContent =
        getLanguage(currentFile);

    renderFileList();

    updateEditorUI();

    setStatus(
        "Editing " + currentFile
    );

    updatePreview();

}


/* ========================================================
   SAVE CURRENT
======================================================== */

function saveCurrentEditor() {

    if (!currentFile) {

        return;

    }

    files[currentFile] =
        codeEditor.value;

}


/* ========================================================
   LANGUAGE
======================================================== */

function getLanguage(filename) {

    const ext =
        filename
            .split(".")
            .pop()
            .toLowerCase();

    switch (ext) {

        case "html":
        case "htm":
            return "HTML";

        case "css":
            return "CSS";

        case "js":
            return "JavaScript";

        case "json":
            return "JSON";

        default:
            return ext.toUpperCase();

    }

}


/* ========================================================
   LINE NUMBERS
======================================================== */

function updateLineNumbers() {

    const lineCount =
        codeEditor.value
            .split("\n")
            .length;

    let output = "";

    for (
        let i = 1;
        i <= lineCount;
        i++
    ) {

        output +=
            i + "\n";

    }

    lineNumbers.textContent =
        output;

}


/* ========================================================
   EDITOR UI
======================================================== */

function updateEditorUI() {

    updateLineNumbers();

    charCount.textContent =
        codeEditor.value.length +
        " characters";

    updateCursor();

    lineNumbers.scrollTop =
        codeEditor.scrollTop;

}


function updateCursor() {

    const beforeCursor =
        codeEditor.value.slice(
            0,
            codeEditor.selectionStart
        );

    const lines =
        beforeCursor.split("\n");

    const line =
        lines.length;

    const column =
        lines[lines.length - 1].length + 1;

    cursorPosition.textContent =
        `Ln ${line}, Col ${column}`;

}


/* ========================================================
   STATUS
======================================================== */

function setStatus(text) {

    statusText.textContent =
        text;

}


/* ========================================================
   TOAST
======================================================== */

let toastTimer;

function showToast(
    message,
    type = ""
) {

    toast.textContent =
        message;

    toast.className =
        "toast show " + type;

    clearTimeout(toastTimer);

    toastTimer =
        setTimeout(() => {

            toast.classList.remove(
                "show"
            );

        }, 2200);

}


/* ========================================================
   HISTORY
======================================================== */

function addHistory(value) {

    if (
        historyIndex >= 0 &&
        history[historyIndex] === value
    ) {

        return;

    }

    history =
        history.slice(
            0,
            historyIndex + 1
        );

    history.push(value);

    if (history.length > 50) {

        history.shift();

    }

    historyIndex =
        history.length - 1;

}


function undo() {

    if (historyIndex <= 0) {

        showToast(
            "Nothing to undo."
        );

        return;

    }

    historyIndex--;

    codeEditor.value =
        history[historyIndex];

    saveCurrentEditor();

    updateEditorUI();

    updatePreview();

    setStatus("Undo");

}


function redo() {

    if (
        historyIndex < 0 ||
        historyIndex >= history.length - 1
    ) {

        showToast(
            "Nothing to redo."
        );

        return;

    }

    historyIndex++;

    codeEditor.value =
        history[historyIndex];

    saveCurrentEditor();

    updateEditorUI();

    updatePreview();

    setStatus("Redo");

}


/* ========================================================
   PREVIEW
======================================================== */

function buildPreviewHTML() {

    const html =
        files["index.html"] || "";

    const css =
        files["style.css"] || "";

    const js =
        files["script.js"] || "";

    let result =
        html;

    /*
    Remove local CSS reference because
    the latest CSS is injected below.
    */

    result =
        result.replace(
            /<link\b[^>]*href=["']style\.css["'][^>]*>/gi,
            ""
        );

    /*
    Remove local JavaScript reference because
    the latest JS is injected below.
    */

    result =
        result.replace(
            /<script\b[^>]*src=["']script\.js["'][^>]*><\/script>/gi,
            ""
        );

    const styleTag =
        `<style>
${css}
</style>`;

    const scriptTag =
        `<script>
${js}
<\/script>`;

    if (
        /<\/head>/i.test(result)
    ) {

        result =
            result.replace(
                /<\/head>/i,
                styleTag +
                "\n</head>"
            );

    } else {

        result =
            styleTag +
            "\n" +
            result;

    }

    if (
        /<\/body>/i.test(result)
    ) {

        result =
            result.replace(
                /<\/body>/i,
                scriptTag +
                "\n</body>"
            );

    } else {

        result +=
            scriptTag;

    }

    return result;

}


function updatePreview() {

    saveCurrentEditor();

    if (!files["index.html"]) {

        preview.srcdoc = `
<!DOCTYPE html>
<html>
<body style="
    font-family:Arial;
    padding:30px;
">
    <h2>No index.html</h2>
    <p>
        Create an index.html file to preview the site.
    </p>
</body>
</html>
`;

        previewAddress.value =
            getPlanteerPath(
                currentFile
            );

        return;

    }

    const result =
        buildPreviewHTML();

    preview.srcdoc =
        result;

    previewAddress.value =
        getPlanteerPath(
            currentFile
        );

    setStatus(
        "Preview updated"
    );

}


/* ========================================================
   DOWNLOAD
======================================================== */

function downloadCurrentFile() {

    saveCurrentEditor();

    const blob =
        new Blob(
            [
                files[currentFile]
            ],
            {
                type:
                    "text/plain;charset=utf-8"
            }
        );

    const url =
        URL.createObjectURL(blob);

    const link =
        document.createElement("a");

    link.href =
        url;

    link.download =
        currentFile;

    document.body.appendChild(
        link
    );

    link.click();

    link.remove();

    URL.revokeObjectURL(
        url
    );

    showToast(
        "Downloaded " +
        currentFile,
        "success"
    );

}


/* ========================================================
   OPEN PREVIEW
======================================================== */

function openPreview() {

    updatePreview();

    const html =
        buildPreviewHTML();

    const blob =
        new Blob(
            [html],
            {
                type:
                    "text/html"
            }
        );

    const url =
        URL.createObjectURL(
            blob
        );

    window.open(
        url,
        "_blank",
        "noopener,noreferrer"
    );

    setTimeout(
        () => {

            URL.revokeObjectURL(
                url
            );

        },
        30000
    );

}


/* ========================================================
   NEW FILE
======================================================== */

function openNewFileModal() {

    newFileInput.value =
        "";

    newFileModal.classList.add(
        "show"
    );

    setTimeout(
        () => {

            newFileInput.focus();

        },
        50
    );

}


function closeNewFileModal() {

    newFileModal.classList.remove(
        "show"
    );

}


function createNewFile() {

    let filename =
        newFileInput.value.trim();

    if (!filename) {

        showToast(
            "Enter a filename.",
            "error"
        );

        return;

    }

    filename =
        filename.replace(
            /[<>:"/\\|?*]/g,
            ""
        );

    if (!filename) {

        showToast(
            "That filename is not valid.",
            "error"
        );

        return;

    }

    if (filename in files) {

        showToast(
            "That file already exists.",
            "error"
        );

        return;

    }

    files[filename] =
        "";

    saveFiles();

    closeNewFileModal();

    renderFileList();

    switchFile(
        filename
    );

    showToast(
        "Created " +
        filename,
        "success"
    );

}


/* ========================================================
   FORMAT
======================================================== */

function formatCurrentFile() {

    const ext =
        currentFile
            .split(".")
            .pop()
            .toLowerCase();

    if (
        ext !== "html" &&
        ext !== "htm"
    ) {

        showToast(
            "Basic formatting is currently for HTML.",
            "error"
        );

        return;

    }

    let text =
        codeEditor.value.trim();

    text =
        text.replace(
            />\s+</g,
            "><"
        );

    let indent =
        0;

    const tokens =
        text.split(
            /(<[^>]+>)/g
        );

    let output =
        "";

    for (
        const token of tokens
    ) {

        if (!token.trim()) {

            continue;

        }

        if (
            /^<\/(body|html|head|main|section|div|ul|ol|li|header|footer|nav|article|p|h[1-6])>/i
                .test(token)
        ) {

            indent =
                Math.max(
                    0,
                    indent - 1
                );

        }

        output +=
            "    ".repeat(indent) +
            token.trim() +
            "\n";

        if (
            /^<(html|head|body|main|section|div|ul|ol|li|header|footer|nav|article)[^>]*>$/i
                .test(token)
        ) {

            indent++;

        }

    }

    codeEditor.value =
        output.trim();

    saveCurrentEditor();

    addHistory(
        codeEditor.value
    );

    updateEditorUI();

    updatePreview();

    showToast(
        "HTML formatted.",
        "success"
    );

}


/* ========================================================
   CLEAR
======================================================== */

function clearEditor() {

    if (
        !confirm(
            "Clear the contents of " +
            currentFile +
            "?"
        )
    ) {

        return;

    }

    codeEditor.value =
        "";

    saveCurrentEditor();

    addHistory("");

    updateEditorUI();

    updatePreview();

    setStatus(
        "File cleared"
    );

}


/* ========================================================
   TAB
======================================================== */

function handleTab(event) {

    if (event.key !== "Tab") {

        return;

    }

    event.preventDefault();

    const start =
        codeEditor.selectionStart;

    const end =
        codeEditor.selectionEnd;

    const value =
        codeEditor.value;

    codeEditor.value =
        value.substring(
            0,
            start
        ) +
        "    " +
        value.substring(
            end
        );

    codeEditor.selectionStart =
        codeEditor.selectionEnd =
        start + 4;

    saveCurrentEditor();

    addHistory(
        codeEditor.value
    );

    updateEditorUI();

    updatePreview();

}


/* ========================================================
   EDITOR EVENTS
======================================================== */

codeEditor.addEventListener(
    "input",
    () => {

        saveCurrentEditor();

        addHistory(
            codeEditor.value
        );

        updateEditorUI();

        if (
            currentFile === "index.html" ||
            currentFile === "style.css" ||
            currentFile === "script.js"
        ) {

            updatePreview();

        }

    }
);


codeEditor.addEventListener(
    "keyup",
    updateCursor
);


codeEditor.addEventListener(
    "click",
    updateCursor
);


codeEditor.addEventListener(
    "select",
    updateCursor
);


codeEditor.addEventListener(
    "scroll",
    () => {

        lineNumbers.scrollTop =
            codeEditor.scrollTop;

    }
);


codeEditor.addEventListener(
    "keydown",
    handleTab
);

   BUTTON EVENTS
======================================================== */

document.getElementById(
    "saveBtn"
).addEventListener(
    "click",
    () => {

        saveCurrentEditor();

        saveFiles();

        renderFileList();

        showToast(
            "Saved.",
            "success"
        );

    }
);


document.getElementById(
    "previewBtn"
).addEventListener(

);


document.getElementById(

);


document.getElementById(

document.getElementById(

/* ========================================================
   NEW FILE KEYBOARD EVENTS
======================================================== */

newFileInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter"
        ) {

            createNewFile();

        }

        if (
            event.key === "Escape"
        ) {

            closeNewFileModal();

        }

    }
);


newFileModal.addEventListener(
    "click",
    event => {

        if (
            event.target ===
            newFileModal
        ) {

            closeNewFileModal();

        }

    }
);


/* ========================================================
   KEYBOARD SHORTCUTS
======================================================== */

document.addEventListener(
    "keydown",
    event => {

        if (
            (event.ctrlKey ||
             event.metaKey) &&
            event.key.toLowerCase() === "s"
        ) {

            event.preventDefault();

            saveCurrentEditor();

            saveFiles();

            showToast(
                "Saved.",
                "success"
            );

        }


        if (
            (event.ctrlKey ||
             event.metaKey) &&
            event.key.toLowerCase() === "p"
        ) {

            event.preventDefault();

            updatePreview();

        }


        if (
            (event.ctrlKey ||
             event.metaKey) &&
            event.key.toLowerCase() === "z"
        ) {

            if (!event.shiftKey) {

                event.preventDefault();

                undo();

            }

        }


        if (
            (event.ctrlKey ||
             event.metaKey) &&
            event.shiftKey &&
            event.key.toLowerCase() === "z"
        ) {

            event.preventDefault();

            redo();

        }

    }
);


/* ========================================================
   INITIALIZE
======================================================== */

function initialize() {

    /*
    Ensure the core files always exist.
    */

    if (!files["index.html"]) {

        files["index.html"] =
            defaultFiles["index.html"];

    }

    if (!files["style.css"]) {

        files["style.css"] =
            defaultFiles["style.css"];

    }

    if (!files["script.js"]) {

        files["script.js"] =
            defaultFiles["script.js"];

    }

    currentFile =
        "index.html";

    codeEditor.value =
        files[currentFile];

    currentFilename.textContent =
        currentFile;

    language.textContent =
        getLanguage(currentFile);

    previewAddress.value =
        getPlanteerPath(
            currentFile
        );

    renderFileList();

    addHistory(
        codeEditor.value
    );

    updateEditorUI();

    updatePreview();

    setStatus(
        "Planteer Editor Ready"
    );

    console.log(
        "PLANTEER EDITOR READY"
    );

    console.log(
        "Authentication is handled by the existing Planteer session."
    );

    console.log(
        "Editor path:",
        PLANTEER_SITE_PATH
    );

}


initialize();
