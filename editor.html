<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Planteer Editor</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      color: #111;
    }

    header {
      background: #111;
      color: white;
      padding: 15px 25px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    header button {
      padding: 8px 12px;
      cursor: pointer;
    }

    main {
      max-width: 1200px;
      margin: 25px auto;
      padding: 0 20px;
    }

    .info {
      background: white;
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 20px;
    }

    .info h2 {
      margin-top: 0;
    }

    textarea {
      display: block;
      width: 100%;
      min-height: 550px;
      resize: vertical;

      padding: 15px;

      border: 1px solid #999;
      border-radius: 8px;

      background: #111;
      color: white;

      font-family: Consolas, Monaco, monospace;
      font-size: 14px;
      line-height: 1.5;
    }

    .buttons {
      margin-top: 15px;
    }

    button {
      padding: 10px 16px;
      margin-right: 8px;
      cursor: pointer;
      border: 1px solid #999;
      border-radius: 5px;
      background: white;
    }

    button:hover {
      background: #e8e8e8;
    }

    .primary {
      background: #111;
      color: white;
      border-color: #111;
    }

    .primary:hover {
      background: #333;
    }

    #status {
      background: white;
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 12px;
      margin-top: 15px;
      white-space: pre-wrap;
    }

    .error {
      color: #b00020;
    }

    .success {
      color: green;
    }
  </style>
</head>

<body>

<header>

  <h1>Planteer Editor</h1>

  <button id="dashboardButton">
    Dashboard
  </button>

</header>


<main>

  <div class="info">

    <h2 id="siteName">
      Loading website...
    </h2>

    <p id="siteID">
      Website ID: loading...
    </p>

  </div>


  <label for="editor">
    <strong>index.html</strong>
  </label>

  <textarea id="editor"></textarea>


  <div class="buttons">

    <button
      id="loadButton"
    >
      Reload
    </button>

    <button
      id="saveButton"
      class="primary"
    >
      Save
    </button>

    <button
      id="publishButton"
    >
      Publish
    </button>

    <button
      id="openButton"
    >
      Open Website
    </button>

  </div>


  <div id="status">
    Starting editor...
  </div>

</main>


<script>

  /*
  ==========================================
  CONFIGURATION
  ==========================================
  */

  const API =
    "https://hard-planet-hosting.josiahdduncan.workers.dev";


  /*
  ==========================================
  ELEMENTS
  ==========================================
  */

  const editor =
    document.getElementById("editor");

  const siteName =
    document.getElementById("siteName");

  const siteID =
    document.getElementById("siteID");

  const status =
    document.getElementById("status");

  const loadButton =
    document.getElementById("loadButton");

  const saveButton =
    document.getElementById("saveButton");

  const publishButton =
    document.getElementById("publishButton");

  const openButton =
    document.getElementById("openButton");

  const dashboardButton =
    document.getElementById("dashboardButton");


  /*
  ==========================================
  GET WEBSITE ID FROM URL
  ==========================================
  */

  const params =
    new URLSearchParams(
      window.location.search
    );

  const websiteId =
    Number(
      params.get("website")
    );


  /*
  ==========================================
  VALIDATE WEBSITE ID
  ==========================================
  */

  if (
    !Number.isInteger(websiteId) ||
    websiteId <= 0
  ) {

    status.textContent =
      "No valid website ID was provided.";

    status.className =
      "error";

    editor.disabled = true;
    saveButton.disabled = true;
    publishButton.disabled = true;
    loadButton.disabled = true;
    openButton.disabled = true;

  }


  /*
  ==========================================
  LOAD WEBSITE INFORMATION
  ==========================================
  */

  async function loadWebsite() {

    if (!websiteId) {
      return;
    }

    status.textContent =
      "Loading website...";

    status.className = "";


    try {

      const response =
        await fetch(
          API + "/api/websites"
        );


      const data =
        await response.json();


      if (!response.ok) {

        throw new Error(
          data.error ||
          "Could not load websites."
        );

      }


      const website =
        data.websites.find(
          item =>
            Number(item.id) === websiteId
        );


      if (!website) {

        throw new Error(
          "Website not found."
        );

      }


      siteName.textContent =
        website.site_name;


      siteID.textContent =
        "Website ID: " +
        website.id;


      await loadFile();


    } catch (error) {

      status.textContent =
        "Error:\n" +
        error.message;

      status.className =
        "error";

    }

  }


  /*
  ==========================================
  LOAD INDEX.HTML
  ==========================================
  */

  async function loadFile() {

    status.textContent =
      "Loading index.html...";


    try {

      const response =
        await fetch(
          API +
          "/api/files?website_id=" +
          encodeURIComponent(
            websiteId
          )
        );


      const data =
        await response.json();


      if (!response.ok) {

        throw new Error(
          data.error ||
          "Could not load files."
        );

      }


      const indexFile =
        data.files.find(
          file =>
            file.path === "index.html"
        );


      if (indexFile) {

        editor.value =
          indexFile.content;

        status.textContent =
          "index.html loaded.";

      } else {

        editor.value =
`<!DOCTYPE html>
<html>
<head>
  <title>My Planteer Site</title>
</head>
<body>

  <h1>Hello from Planteer!</h1>

</body>
</html>`;

        status.textContent =
          "No index.html exists yet. A new one was created in the editor.";

      }


    } catch (error) {

      status.textContent =
        "Error loading file:\n" +
        error.message;

      status.className =
        "error";

    }

  }


  /*
  ==========================================
  SAVE
  ==========================================
  */

  async function saveFile() {

    status.textContent =
      "Saving...";

    status.className = "";


    try {

      const response =
        await fetch(
          API + "/api/files",
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body: JSON.stringify({

              website_id:
                websiteId,

              path:
                "index.html",

              content:
                editor.value,

              content_type:
                "text/html"

            })

          }
        );


      const data =
        await response.json();


      if (!response.ok) {

        throw new Error(
          data.error ||
          "Save failed."
        );

      }


      status.textContent =
        "Saved successfully.";

      status.className =
        "success";


    } catch (error) {

      status.textContent =
        "Save failed:\n" +
        error.message;

      status.className =
        "error";

    }

  }


  /*
  ==========================================
  PUBLISH
  ==========================================
  */

  async function publishWebsite() {

    status.textContent =
      "Publishing...";

    status.className = "";


    try {

      /*
      Save first so the newest
      version gets published.
      */

      const saveResponse =
        await fetch(
          API + "/api/files",
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body: JSON.stringify({

              website_id:
                websiteId,

              path:
                "index.html",

              content:
                editor.value,

              content_type:
                "text/html"

            })

          }
        );


      const saveData =
        await saveResponse.json();


      if (!saveResponse.ok) {

        throw new Error(
          saveData.error ||
          "Could not save before publishing."
        );

      }


      /*
      Now publish.
      */

      const response =
        await fetch(
          API +
          "/api/websites/" +
          websiteId +
          "/publish",
          {
            method: "POST"
          }
        );


      const data =
        await response.json();


      if (!response.ok) {

        throw new Error(
          data.error ||
          "Publish failed."
        );

      }


      status.textContent =
        "Published successfully!\n\n" +
        "Live URL:\n" +
        API +
        "/site/" +
        encodeURIComponent(
          data.website.site_name
        ) +
        "/";

      status.className =
        "success";


    } catch (error) {

      status.textContent =
        "Publish failed:\n" +
        error.message;

      status.className =
        "error";

    }

  }


  /*
  ==========================================
  OPEN WEBSITE
  ==========================================
  */

  async function openWebsite() {

    try {

      const response =
        await fetch(
          API + "/api/websites"
        );


      const data =
        await response.json();


      const website =
        data.websites.find(
          item =>
            Number(item.id) === websiteId
        );


      if (!website) {

        throw new Error(
          "Website not found."
        );

      }


      window.open(
        API +
        "/site/" +
        encodeURIComponent(
          website.site_name
        ) +
        "/",
        "_blank"
      );


    } catch (error) {

      status.textContent =
        "Could not open website:\n" +
        error.message;

      status.className =
        "error";

    }

  }


  /*
  ==========================================
  BUTTONS
  ==========================================
  */

  loadButton.addEventListener(
    "click",
    loadFile
  );


  saveButton.addEventListener(
    "click",
    saveFile
  );


  publishButton.addEventListener(
    "click",
    publishWebsite
  );


  openButton.addEventListener(
    "click",
    openWebsite
  );


  dashboardButton.addEventListener(
    "click",
    () => {
      window.location.href =
        "dashboard.html";
    }
  );


  /*
  ==========================================
  START
  ==========================================
  */

  loadWebsite();

</script>

</body>
</html>
