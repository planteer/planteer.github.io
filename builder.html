<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Planteer Builder</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Segoe UI,Arial,sans-serif;
  background:#05070b;
  color:#eee;
}

button,input,textarea,select{font:inherit}
button{cursor:pointer}

:root{
  --bg:#05070b;
  --panel:#080c12;
  --panel2:#0a0f15;
  --panel3:#10151f;
  --border:#202c37;
  --border2:#293541;
  --text:#eee;
  --muted:#8194a7;
  --green:#35ff88;
  --purple:#7256b8;
  --red:#ff6666;
  --yellow:#d4c47e;
}

.app{
  width:100%;
  height:100%;
  display:grid;
  grid-template-rows:58px 1fr;
}

.topbar{
  display:flex;
  align-items:center;
  gap:13px;
  padding:0 13px;
  background:var(--panel2);
  border-bottom:1px solid var(--border);
  z-index:10;
}

.logo{
  color:var(--green);
  font-size:21px;
  font-weight:900;
  margin-right:6px;
}

.site-title{
  flex:1;
  min-width:0;
}

.site-name{
  font-weight:800;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.site-path{
  color:#6f8395;
  font:11px Consolas,monospace;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.top-actions{
  display:flex;
  gap:6px;
}

.btn{
  border:1px solid var(--border2);
  background:var(--panel3);
  color:var(--text);
  border-radius:8px;
  padding:8px 11px;
  transition:.15s;
}

.btn:hover{
  border-color:var(--green);
  transform:translateY(-1px);
}

.btn.primary{
  background:var(--green);
  color:#061008;
  border-color:var(--green);
  font-weight:800;
}

.btn.ai{
  border-color:var(--purple);
  background:#171125;
}

.btn.danger{
  border-color:#673333;
  color:#ff9999;
}

.btn.small{
  padding:6px 8px;
  font-size:11px;
}

.workspace{
  min-height:0;
  display:grid;
  grid-template-columns:245px minmax(330px,1fr) minmax(350px,43%);
}

.sidebar{
  min-width:0;
  min-height:0;
  display:flex;
  flex-direction:column;
  background:var(--panel);
  border-right:1px solid var(--border);
}

.sidebar-head{
  height:50px;
  padding:0 9px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid #1c2732;
}

.sidebar-title{
  color:#91a4b6;
  font-size:12px;
  font-weight:800;
  letter-spacing:.7px;
  text-transform:uppercase;
}

.file-actions{
  display:flex;
  gap:4px;
}

.small-btn{
  width:28px;
  height:28px;
  padding:0;
  border:1px solid var(--border2);
  border-radius:7px;
  background:var(--panel3);
  color:#ddd;
}

.small-btn:hover{
  color:var(--green);
  border-color:var(--green);
}

.file-tree{
  min-height:0;
  overflow:auto;
  padding:8px;
}

.tree-item{
  min-height:31px;
  display:flex;
  align-items:center;
  gap:7px;
  padding:4px 7px;
  border-radius:6px;
  color:#c8d3dc;
  user-select:none;
}

.tree-item:hover{
  background:#101720;
}

.tree-item.active{
  background:#13251c;
  color:var(--green);
}

.tree-item.folder{
  color:var(--yellow);
}

.tree-name{
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

.empty-tree{
  padding:20px 8px;
  color:#687b8e;
  font-size:13px;
  text-align:center;
}

.sidebar-bottom{
  border-top:1px solid var(--border);
  padding:9px;
}

.sidebar-tool{
  width:100%;
  margin-top:6px;
}

.editor-area{
  min-width:0;
  min-height:0;
  display:grid;
  grid-template-rows:42px 38px 1fr;
  background:#05070b;
}

.editor-tabs{
  display:flex;
  align-items:end;
  overflow:auto;
  background:#0a0e14;
  border-bottom:1px solid var(--border);
}

.tab{
  height:42px;
  min-width:120px;
  max-width:220px;
  display:flex;
  align-items:center;
  gap:7px;
  padding:0 12px;
  border-right:1px solid var(--border);
  color:#8294a5;
  font-size:12px;
}

.tab.active{
  background:#10151f;
  color:#eee;
  border-top:2px solid var(--green);
}

.editor-toolbar{
  display:flex;
  align-items:center;
  gap:5px;
  padding:4px 8px;
  overflow-x:auto;
  background:#080c12;
  border-bottom:1px solid var(--border);
}

.editor-toolbar .separator{
  width:1px;
  height:20px;
  background:var(--border);
  margin:0 3px;
}

.editor-wrap{
  min-height:0;
  position:relative;
}

#editor{
  width:100%;
  height:100%;
  resize:none;
  border:0;
  outline:0;
  padding:18px 18px 45px;
  background:#070a0f;
  color:#dce7ef;
  font:14px/1.55 Consolas,"Courier New",monospace;
  tab-size:2;
  white-space:pre;
}

.editor-info{
  position:absolute;
  left:12px;
  bottom:9px;
  color:#4e6172;
  pointer-events:none;
  font:10px Consolas,monospace;
}

.right{
  min-width:0;
  min-height:0;
  display:grid;
  grid-template-rows:45px minmax(240px,1fr) 285px;
  background:var(--panel);
  border-left:1px solid var(--border);
}

.preview-head{
  display:flex;
  align-items:center;
  gap:6px;
  padding:0 9px;
  border-bottom:1px solid var(--border);
}

.preview-title{
  flex:1;
  color:#91a4b6;
  font-size:12px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.6px;
}

.preview-size{
  width:95px;
  height:28px;
  padding:0 5px;
  color:#ddd;
  background:#10151f;
  border:1px solid var(--border2);
  border-radius:6px;
  outline:none;
  font-size:11px;
}

.preview-frame-wrap{
  min-height:0;
  padding:10px;
  background:#15191e;
}

#preview{
  width:100%;
  height:100%;
  border:1px solid var(--border2);
  border-radius:7px;
  background:#fff;
  display:block;
}

.ai-panel{
  min-height:0;
  display:grid;
  grid-template-rows:42px 1fr auto;
  border-top:1px solid var(--border);
  background:#090d14;
}

.ai-head{
  display:flex;
  align-items:center;
  padding:0 12px;
  border-bottom:1px solid var(--border);
}

.ai-title{
  flex:1;
  color:#cbbcff;
  font-weight:800;
  font-size:12px;
  text-transform:uppercase;
}

.ai-status{
  color:var(--green);
  font-size:11px;
}

.ai-messages{
  min-height:0;
  overflow:auto;
  padding:10px;
}

.message{
  margin-bottom:9px;
  padding:9px 11px;
  border-radius:8px;
  line-height:1.4;
  font-size:12px;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.message.ai{
  background:#11121d;
  border:1px solid #28243a;
}

.message.user{
  background:#102219;
  border:1px solid #1d4530;
}

.ai-input{
  display:flex;
  gap:7px;
  padding:9px;
  border-top:1px solid var(--border);
}

#aiPrompt{
  flex:1;
  min-width:0;
  height:54px;
  resize:none;
  padding:9px;
  background:#070a0f;
  color:#eee;
  border:1px solid var(--border2);
  border-radius:7px;
  outline:none;
  font-size:12px;
}

#aiPrompt:focus{
  border-color:var(--purple);
}

.status{
  position:fixed;
  left:50%;
  bottom:16px;
  z-index:100;
  transform:translate(-50%,100px);
  opacity:0;
  padding:10px 16px;
  background:#101820;
  border:1px solid #334452;
  border-radius:8px;
  transition:.2s;
  font-size:12px;
  pointer-events:none;
}

.status.show{
  transform:translate(-50%,0);
  opacity:1;
}

.modal-bg{
  position:fixed;
  inset:0;
  z-index:200;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(0,0,0,.65);
  backdrop-filter:blur(4px);
}

.modal-bg.show{
  display:flex;
}

.modal{
  width:min(470px,100%);
  background:#0d131b;
  border:1px solid var(--border2);
  border-radius:13px;
  padding:20px;
  box-shadow:0 25px 70px rgba(0,0,0,.45);
}

.modal h2{
  margin:0 0 7px;
}

.modal p{
  margin:0 0 15px;
  color:#8194a7;
  font-size:13px;
  line-height:1.5;
}

.modal input{
  width:100%;
  padding:11px;
  background:#070a0f;
  color:#eee;
  border:1px solid var(--border2);
  border-radius:8px;
  outline:none;
}

.modal input:focus{
  border-color:var(--green);
}

.modal-actions{
  display:flex;
  justify-content:flex-end;
  gap:7px;
  margin-top:15px;
}

.context-menu{
  position:fixed;
  z-index:500;
  display:none;
  min-width:180px;
  padding:5px;
  background:#0d131b;
  border:1px solid var(--border2);
  border-radius:9px;
  box-shadow:0 15px 40px rgba(0,0,0,.45);
}

.context-menu.show{
  display:block;
}

.context-item{
  width:100%;
  padding:8px 10px;
  border:0;
  background:transparent;
  color:#ddd;
  text-align:left;
  border-radius:6px;
}

.context-item:hover{
  background:#13251c;
  color:var(--green);
}

.command-panel{
  position:fixed;
  inset:0;
  z-index:400;
  display:none;
  align-items:flex-start;
  justify-content:center;
  padding-top:90px;
  background:rgba(0,0,0,.55);
}

.command-panel.show{
  display:flex;
}

.command-box{
  width:min(600px,calc(100% - 30px));
  background:#0d131b;
  border:1px solid var(--border2);
  border-radius:13px;
  overflow:hidden;
  box-shadow:0 25px 80px rgba(0,0,0,.55);
}

.command-search{
  width:100%;
  border:0;
  outline:0;
  padding:15px;
  background:#070a0f;
  color:#fff;
  font-size:15px;
}

.command-list{
  max-height:400px;
  overflow:auto;
  padding:7px;
}

.command{
  padding:10px;
  border-radius:7px;
  cursor:pointer;
}

.command:hover{
  background:#13251c;
}

.command-title{
  font-weight:700;
}

.command-description{
  color:#718496;
  font-size:11px;
  margin-top:2px;
}

@media(max-width:1150px){
  .workspace{
    grid-template-columns:220px 1fr;
  }

  .right{
    display:none;
  }
}

@media(max-width:700px){
  .workspace{
    grid-template-columns:1fr;
  }

  .sidebar{
    display:none;
  }

  .top-actions .optional{
    display:none;
  }
}
</style>
</head>

<body>

<div class="app">

<header class="topbar">

<div class="logo">Planteer.</div>

<div class="site-title">
  <div id="siteName" class="site-name">
    Loading website...
  </div>
  <div id="sitePath" class="site-path">
    /...
  </div>
</div>

<div class="top-actions">

<button class="btn optional" onclick="goHome()">
Home
</button>

<button class="btn optional" onclick="openCommandPalette()">
Commands
</button>

<button class="btn optional" onclick="saveFile()">
Save
</button>

<button class="btn ai" onclick="focusAI()">
AI
</button>

<button class="btn primary" onclick="deploySite()">
Deploy
</button>

</div>

</header>


<div class="workspace">


<aside class="sidebar">

<div class="sidebar-head">

<div class="sidebar-title">
Files
</div>

<div class="file-actions">

<button class="small-btn" title="New file" onclick="newFile()">
+
</button>

<button class="small-btn" title="New folder" onclick="newFolder()">
□
</button>

<button class="small-btn" title="Rename" onclick="renameSelected()">
✎
</button>

<button class="small-btn" title="Delete" onclick="deleteSelected()">
×
</button>

</div>

</div>

<div id="fileTree" class="file-tree">
<div class="empty-tree">
Loading files...
</div>
</div>

<div class="sidebar-bottom">

<button class="btn small sidebar-tool" onclick="createStarterFiles()">
Create Starter Website
</button>

<button class="btn small sidebar-tool" onclick="downloadProject()">
Download Project
</button>

</div>

</aside>


<section class="editor-area">

<div id="editorTabs" class="editor-tabs"></div>

<div class="editor-toolbar">

<button class="btn small" onclick="insertHTMLStarter()">
HTML
</button>

<button class="btn small" onclick="insertCSSStarter()">
CSS
</button>

<button class="btn small" onclick="insertJSStarter()">
JS
</button>

<div class="separator"></div>

<button class="btn small" onclick="formatCurrentFile()">
Format
</button>

<button class="btn small" onclick="duplicateSelected()">
Duplicate
</button>

<button class="btn small" onclick="clearEditor()">
Clear
</button>

<div class="separator"></div>

<button class="btn small" onclick="refreshPreview()">
Preview
</button>

</div>

<div class="editor-wrap">

<textarea
  id="editor"
  spellcheck="false"
  placeholder="Select a file..."
></textarea>

<div id="editorInfo" class="editor-info">
No file selected
</div>

</div>

</section>


<section class="right">

<div class="preview-head">

<div class="preview-title">
Live Preview
</div>

<select
  id="previewSize"
  class="preview-size"
  onchange="changePreviewSize()"
>
<option value="100%">Responsive</option>
<option value="375px">Mobile</option>
<option value="768px">Tablet</option>
<option value="1024px">Desktop</option>
</select>

<button class="small-btn" onclick="refreshPreview()" title="Refresh">
↻
</button>

<button class="small-btn" onclick="openPreviewNewTab()" title="Open">
↗
</button>

</div>

<div class="preview-frame-wrap">

<iframe
  id="preview"
  sandbox="allow-scripts allow-forms allow-modals"
  title="Planteer live preview"
></iframe>

</div>


<section class="ai-panel">

<div class="ai-head">

<div class="ai-title">
Planteer AI
</div>

<div id="aiStatus" class="ai-status">
Ready
</div>

</div>

<div id="aiMessages" class="ai-messages">

<div class="message ai">
Planteer AI is ready.

Ask me to build, edit, debug, explain,
design, or improve your website.

AI can work with the current file
and the rest of your project.
</div>

</div>

<div class="ai-input">

<textarea
  id="aiPrompt"
  placeholder="Ask Planteer AI..."
></textarea>

<button class="btn ai" onclick="askAI()">
Send
</button>

</div>

</section>

</section>

</div>

</div>


<div id="status" class="status">
Ready
</div>


<div id="modalBg" class="modal-bg">

<div class="modal">

<h2 id="modalTitle">
New File
</h2>

<p id="modalText">
Enter a name.
</p>

<input id="modalInput" autocomplete="off">

<div class="modal-actions">

<button class="btn" onclick="closeModal()">
Cancel
</button>

<button class="btn primary" onclick="submitModal()">
Continue
</button>

</div>

</div>

</div>


<div id="contextMenu" class="context-menu">

<button class="context-item" onclick="newFile();hideContextMenu()">
New File
</button>

<button class="context-item" onclick="newFolder();hideContextMenu()">
New Folder
</button>

<button class="context-item" onclick="renameSelected();hideContextMenu()">
Rename
</button>

<button class="context-item" onclick="duplicateSelected();hideContextMenu()">
Duplicate
</button>

<button class="context-item" onclick="deleteSelected();hideContextMenu()">
Delete
</button>

</div>


<div id="commandPanel" class="command-panel">

<div class="command-box">

<input
  id="commandSearch"
  class="command-search"
  placeholder="Search commands..."
  autocomplete="off"
>

<div id="commandList" class="command-list"></div>

</div>

</div>


<script>

/* =========================================================
   PLANTEER BUILDER
   ========================================================= */

const WORKER =
  "https://planteer.duncanhomeschool.workers.dev";

const params =
  new URLSearchParams(
    location.search
  );

const siteId =
  params.get("site");

let site = null;
let files = [];
let selectedPath = null;
let modalAction = null;
let saveTimer = null;
let statusTimer = null;


/* =========================================================
   DOM
   ========================================================= */

const editor =
  document.getElementById("editor");

const fileTree =
  document.getElementById("fileTree");

const editorTabs =
  document.getElementById("editorTabs");

const preview =
  document.getElementById("preview");


/* =========================================================
   STATUS
   ========================================================= */

function showStatus(message){

  const box =
    document.getElementById("status");

  box.textContent =
    message;

  box.classList.add("show");

  clearTimeout(statusTimer);

  statusTimer =
    setTimeout(
      () => box.classList.remove("show"),
      2500
    );
}


/* =========================================================
   HOME
   ========================================================= */

function goHome(){

  location.href =
    "index.html";
}


/* =========================================================
   PATH
   ========================================================= */

function normalizePath(path){

  return String(path || "")
    .replaceAll("\\","/")
    .replace(/^\/+/,"")
    .replace(/\/+/g,"/");
}


/* =========================================================
   FILE LOOKUP
   ========================================================= */

function getFile(path){

  path =
    normalizePath(path);

  return files.find(
    file =>
      normalizePath(file.path) === path &&
      !file.is_folder
  );
}


/* =========================================================
   LOAD SITE
   ========================================================= */

async function loadSite(){

  if(!siteId){

    document.getElementById("siteName")
      .textContent =
      "No website selected";

    showStatus(
      "Open the builder with a website selected."
    );

    return;
  }

  try{

    const response =
      await fetch(
        WORKER +
        "/api/sites/" +
        encodeURIComponent(siteId)
      );

    const data =
      await response.json();

    if(!response.ok || !data.ok){

      throw new Error(
        data.error ||
        "Could not load website."
      );
    }

    site =
      data.site;

    files =
      data.files || [];

    document.getElementById("siteName")
      .textContent =
      site.name ||
      "Untitled Website";

    document.getElementById("sitePath")
      .textContent =
      "/" +
      (site.slug || site.name || "site") +
      "/";

    renderTree();

    const index =
      getFile("index.html");

    const first =
      index ||
      files.find(
        file => !file.is_folder
      );

    if(first){

      selectFile(
        first.path
      );

    }else{

      editor.value = "";

      selectedPath = null;

      renderTabs();
    }

    updatePreview();

  }catch(error){

    console.error(error);

    showStatus(
      error.message ||
      "Failed to load website."
    );
  }
}


/* =========================================================
   FILE ICON
   ========================================================= */

function fileIcon(file){

  if(
    file.is_folder ||
    file.type === "folder"
  ){
    return "▸";
  }

  const path =
    normalizePath(file.path).toLowerCase();

  if(path.endsWith(".html")) return "◇";
  if(path.endsWith(".css")) return "◆";
  if(path.endsWith(".js")) return "◈";
  if(path.endsWith(".json")) return "{}";
  if(path.endsWith(".svg")) return "◇";
  if(path.endsWith(".md")) return "M";

  return "•";
}


/* =========================================================
   FILE TREE
   ========================================================= */

function renderTree(){

  if(!files.length){

    fileTree.innerHTML =
      `<div class="empty-tree">No files yet.</div>`;

    return;
  }

  const sorted =
    [...files].sort(
      (a,b) => {

        const af =
          Boolean(a.is_folder);

        const bf =
          Boolean(b.is_folder);

        if(af !== bf){
          return af ? -1 : 1;
        }

        return normalizePath(a.path)
          .localeCompare(
            normalizePath(b.path)
          );
      }
    );

  fileTree.innerHTML =
    sorted.map(
      file => {

        const path =
          normalizePath(file.path);

        const depth =
          Math.max(
            0,
            path.split("/").length - 1
          );

        const active =
          !file.is_folder &&
          selectedPath === path;

        return `
          <div
            class="tree-item
              ${file.is_folder ? "folder" : ""}
              ${active ? "active" : ""}"
            style="padding-left:${7 + depth * 14}px"
            data-path="${escapeHTML(path)}"
          >
            <span>${fileIcon(file)}</span>
            <span class="tree-name">
              ${escapeHTML(
                path.split("/").pop()
              )}
            </span>
          </div>
        `;
      }
    ).join("");

  fileTree
    .querySelectorAll(".tree-item")
    .forEach(item => {

      item.addEventListener(
        "click",
        () => {

          const path =
            item.dataset.path;

          const file =
            files.find(
              f =>
                normalizePath(f.path) === path
            );

          if(file?.is_folder) return;

          selectFile(path);
        }
      );

      item.addEventListener(
        "contextmenu",
        event => {

          event.preventDefault();

          const path =
            item.dataset.path;

          const file =
            files.find(
              f =>
                normalizePath(f.path) === path
            );

          if(file && !file.is_folder){

            selectFile(path);
          }

          showContextMenu(
            event.clientX,
            event.clientY
          );
        }
      );
    });
}


/* =========================================================
   SELECT FILE
   ========================================================= */

function selectFile(path){

  path =
    normalizePath(path);

  const file =
    getFile(path);

  if(!file){

    showStatus(
      "File not found."
    );

    return;
  }

  saveCurrentIntoMemory();

  selectedPath =
    path;

  editor.value =
    file.content ?? "";

  updateEditorInfo();

  renderTree();

  renderTabs();

  updatePreview();
}


/* =========================================================
   MEMORY
   ========================================================= */

function saveCurrentIntoMemory(){

  if(!selectedPath) return;

  const file =
    getFile(selectedPath);

  if(!file) return;

  file.content =
    editor.value;
}


function updateEditorInfo(){

  if(!selectedPath){

    document.getElementById(
      "editorInfo"
    ).textContent =
      "No file selected";

    return;
  }

  const lines =
    editor.value
      .split("\n")
      .length;

  document.getElementById(
    "editorInfo"
  ).textContent =
    selectedPath +
    " · " +
    editor.value.length +
    " characters · " +
    lines +
    " lines";
}


/* =========================================================
   TABS
   ========================================================= */

function renderTabs(){

  if(!selectedPath){

    editorTabs.innerHTML = "";

    return;
  }

  editorTabs.innerHTML =
    `
      <div class="tab active">
        ${fileIcon({
          path:selectedPath,
          is_folder:false
        })}
        <span>
          ${escapeHTML(
            selectedPath.split("/").pop()
          )}
        </span>
      </div>
    `;
}


/* =========================================================
   EDITOR
   ========================================================= */

editor.addEventListener(
  "input",
  () => {

    saveCurrentIntoMemory();

    updateEditorInfo();

    clearTimeout(saveTimer);

    saveTimer =
      setTimeout(
        updatePreview,
        300
      );
  }
);


/* =========================================================
   TAB KEY
   ========================================================= */

editor.addEventListener(
  "keydown",
  event => {

    if(event.key === "Tab"){

      event.preventDefault();

      const start =
        editor.selectionStart;

      const end =
        editor.selectionEnd;

      editor.value =
        editor.value.substring(
          0,
          start
        ) +
        "  " +
        editor.value.substring(
          end
        );

      editor.selectionStart =
        editor.selectionEnd =
        start + 2;

      saveCurrentIntoMemory();

      updateEditorInfo();

      updatePreview();
    }
  }
);


/* =========================================================
   SAVE
   ========================================================= */

async function saveFile(){

  saveCurrentIntoMemory();

  if(!siteId){

    showStatus(
      "No site selected."
    );

    return false;
  }

  try{

    showStatus("Saving...");

    const response =
      await fetch(
        WORKER +
        "/api/sites/" +
        encodeURIComponent(siteId) +
        "/files",
        {
          method:"PUT",
          headers:{
            "Content-Type":
              "application/json"
          },
          body:
            JSON.stringify({
              files
            })
        }
      );

    const data =
      await response.json();

    if(!response.ok || !data.ok){

      throw new Error(
        data.error ||
        "Save failed."
      );
    }

    showStatus("Saved.");

    return true;

  }catch(error){

    console.error(error);

    showStatus(
      error.message ||
      "Could not save."
    );

    return false;
  }
}


/* =========================================================
   DEFAULT CONTENT
   ========================================================= */

function defaultContent(path){

  const lower =
    path.toLowerCase();

  if(lower.endsWith(".html")){

    return `<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Planteer Website</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<main>
  <h1>Hello from Planteer!</h1>
  <p>Edit this page in the Planteer Builder.</p>
</main>

<script src="script.js"><\/script>
</body>
</html>`;
  }

  if(lower.endsWith(".css")){

    return `* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background: #05070b;
  color: white;
  padding: 40px;
}

main {
  max-width: 900px;
  margin: auto;
}`;

  }

  if(lower.endsWith(".js")){

    return `console.log("Planteer website loaded.");`;
  }

  if(lower.endsWith(".json")){

    return `{
  "name": "Planteer Website"
}`;
  }

  return "";
}


/* =========================================================
   NEW FILE
   ========================================================= */

function newFile(){

  openModal(
    "New File",
    "Enter a file path, such as index.html or css/style.css.",
    "",
    value => {

      const path =
        normalizePath(value);

      if(!path) return;

      if(
        files.some(
          file =>
            normalizePath(file.path) === path
        )
      ){

        showStatus(
          "That path already exists."
        );

        return;
      }

      files.push({
        path,
        content:
          defaultContent(path),
        is_folder:false
      });

      renderTree();

      selectFile(path);

      saveFile();
    }
  );
}

/* =========================================================
   RENAME
   ========================================================= */

function renameSelected(){

  if(!selectedPath){

    showStatus(
      "Select a file first."
    );

    return;
  }

  openModal(
    "Rename File",
    "Enter the new file path.",
    selectedPath,
    value => {

      const newPath =
        normalizePath(value);

      if(!newPath) return;

      if(
        files.some(
          file =>
            normalizePath(file.path) === newPath
        )
      ){

        showStatus(
          "That path already exists."
        );

        return;
      }

      const file =
        getFile(selectedPath);

      if(!file) return;

      file.path =
        newPath;

      selectedPath =
        newPath;

      renderTree();

      renderTabs();

      saveFile();
    }
  );
}


/* =========================================================
   DUPLICATE
   ========================================================= */

function duplicateSelected(){

  if(!selectedPath){

    showStatus(
      "Select a file first."
    );

    return;
  }

  const file =
    getFile(selectedPath);

  if(!file) return;

  const parts =
    selectedPath.split("/");

  const original =
    parts.pop();

  const dot =
    original.lastIndexOf(".");

  let base =
    dot > 0
      ? original.slice(0,dot)
      : original;

  const ext =
    dot > 0
      ? original.slice(dot)
      : "";

  let number = 2;

  let newPath;

  do{

    newPath =
      [
        ...parts,
        base + "-" + number + ext
      ].join("/");

    number++;

  }while(
    files.some(
      f =>
        normalizePath(f.path) === newPath
    )
  );

  files.push({
    path:newPath,
    content:file.content,
    is_folder:false
  });

  renderTree();

  selectFile(newPath);

  saveFile();
}


/* =========================================================
   DELETE
   ========================================================= */

function deleteSelected(){

  if(!selectedPath){

    showStatus(
      "Select a file first."
    );

    return;
  }

  const path =
    selectedPath;

  openModal(
    "Delete File",
    "Type the path again to confirm deletion: " + path,
    "",
    value => {

      if(value !== path){

        showStatus(
          "Deletion cancelled."
        );

        return;
      }

      files =
        files.filter(
          file =>
            normalizePath(file.path) !== path
        );

      selectedPath = null;

      editor.value = "";

      renderTree();

      renderTabs();

      updateEditorInfo();

      updatePreview();

      saveFile();
    }
  );
}


/* =========================================================
   STARTER WEBSITE
   ========================================================= */

function createStarterFiles(){

  const starter = [

    {
      path:"index.html",
      content:defaultContent("index.html"),
      is_folder:false
    },

    {
      path:"style.css",
      content:defaultContent("style.css"),
      is_folder:false
    },

    {
      path:"script.js",
      content:defaultContent("script.js"),
      is_folder:false
    }

  ];

  let added = 0;

  starter.forEach(file => {

    if(
      !files.some(
        existing =>
          normalizePath(existing.path) === file.path
      )
    ){

      files.push(file);

      added++;
    }
  });

  renderTree();

  selectFile("index.html");

  saveFile();

  showStatus(
    added
      ? "Starter website created."
      : "Starter files already exist."
  );
}


/* =========================================================
   MODAL
   ========================================================= */

function openModal(
  title,
  text,
  value,
  action
){

  document.getElementById("modalTitle")
    .textContent = title;

  document.getElementById("modalText")
    .textContent = text;

  const input =
    document.getElementById("modalInput");

  input.value =
    value;

  modalAction =
    action;

  document.getElementById("modalBg")
    .classList.add("show");

  setTimeout(
    () => input.focus(),
    50
  );
}


function closeModal(){

  document.getElementById("modalBg")
    .classList.remove("show");

  modalAction = null;
}


function submitModal(){

  const input =
    document.getElementById("modalInput");

  const value =
    input.value.trim();

  const action =
    modalAction;

  closeModal();

  if(action){
    action(value);
  }
}


document
  .getElementById("modalInput")
  .addEventListener(
    "keydown",
    event => {

      if(event.key === "Enter"){
        submitModal();
      }

      if(event.key === "Escape"){
        closeModal();
      }
    }
  );


/* =========================================================
   PREVIEW
   ========================================================= */

function updatePreview(){

  saveCurrentIntoMemory();

  const index =
    getFile("index.html");

  if(!index){

    preview.srcdoc =
      `<body style="font-family:Arial;padding:30px">
        <h2>No index.html</h2>
        <p>Create an index.html file to preview your website.</p>
      </body>`;

    return;
  }

  let html =
    index.content || "";

  const css =
    getFile("style.css");

  const js =
    getFile("script.js");

  if(css){

    const cssTag =
      `<style>${css.content || ""}</style>`;

    if(html.includes("</head>")){

      html =
        html.replace(
          "</head>",
          cssTag + "</head>"
        );

    }else{

      html =
        cssTag + html;
    }
  }

  if(js){

    const jsTag =
      `<script>${js.content || ""}<\/script>`;

    if(html.includes("</body>")){

      html =
        html.replace(
          "</body>",
          jsTag + "</body>"
        );

    }else{

      html += jsTag;
    }
  }

  preview.srcdoc =
    html;
}


function refreshPreview(){

  updatePreview();

  showStatus(
    "Preview refreshed."
  );
}


function changePreviewSize(){

  const size =
    document.getElementById(
      "previewSize"
    ).value;

  if(size === "100%"){

    preview.style.width = "100%";
    preview.style.margin = "0";

  }else{

    preview.style.width = size;
    preview.style.margin = "0 auto";
  }
}


function openPreviewNewTab(){

  saveCurrentIntoMemory();

  const index =
    getFile("index.html");

  if(!index){

    showStatus(
      "Create index.html first."
    );

    return;
  }

  const css =
    getFile("style.css");

  const js =
    getFile("script.js");

  let html =
    index.content || "";

  if(css){

    html =
      html.replace(
        "</head>",
        `<style>${css.content || ""}</style></head>`
      );
  }

  if(js){

    html =
      html.replace(
        "</body>",
        `<script>${js.content || ""}<\/script></body>`
      );
  }

  const win =
    window.open(
      "",
      "_blank"
    );

  if(!win){

    showStatus(
      "Browser blocked the preview tab."
    );

    return;
  }

  win.document.open();

  win.document.write(
    html
  );

  win.document.close();
}


/* =========================================================
   DEPLOY
   ========================================================= */

async function deploySite(){

  saveCurrentIntoMemory();

  if(!siteId){

    showStatus(
      "No site selected."
    );

    return;
  }

  try{

    const saved =
      await saveFile();

    if(!saved) return;

    showStatus(
      "Deploying..."
    );

    const response =
      await fetch(
        WORKER +
        "/api/sites/" +
        encodeURIComponent(siteId) +
        "/deploy",
        {
          method:"POST",
          headers:{
            "Content-Type":
              "application/json"
          },
          body:
            JSON.stringify({
              files
            })
        }
      );

    const data =
      await response.json();

    if(!response.ok || !data.ok){

      throw new Error(
        data.error ||
        "Deployment failed."
      );
    }

    showStatus(
      "Deployment successful!"
    );

    if(data.url){

      setTimeout(
        () => window.open(
          data.url,
          "_blank"
        ),
        500
      );
    }

  }catch(error){

    console.error(error);

    showStatus(
      error.message ||
      "Deployment failed."
    );
  }
}


/* =========================================================
   AI
   ========================================================= */

function focusAI(){

  document
    .getElementById("aiPrompt")
    .focus();
}


function addAIMessage(
  text,
  type
){

  const messages =
    document.getElementById(
      "aiMessages"
    );

  const div =
    document.createElement("div");

  div.className =
    "message " + type;

  div.textContent =
    text;

  messages.appendChild(div);

  messages.scrollTop =
    messages.scrollHeight;

  return div;
}


async function askAI(){

  const input =
    document.getElementById(
      "aiPrompt"
    );

  const prompt =
    input.value.trim();

  if(!prompt) return;

  addAIMessage(
    prompt,
    "user"
  );

  input.value = "";

  const status =
    document.getElementById(
      "aiStatus"
    );

  status.textContent =
    "Thinking...";

  try{

    const response =
      await fetch(
        WORKER +
        "/api/ai",
        {
          method:"POST",
          headers:{
            "Content-Type":
              "application/json"
          },
          body:
            JSON.stringify({
              prompt,
              site_id:siteId,
              context:buildAIContext()
            })
        }
      );

    const data =
      await response.json();

    if(!response.ok || !data.ok){

      throw new Error(
        data.error ||
        "AI request failed."
      );
    }

    const answer =
      data.response ||
      data.text ||
      data.message ||
      "The AI returned no response.";

    addAIMessage(
      answer,
      "ai"
    );

    status.textContent =
      "Ready";

  }catch(error){

    console.error(error);

    addAIMessage(
      "AI error: " +
      (
        error.message ||
        "Request failed."
      ),
      "ai"
    );

    status.textContent =
      "Error";
  }
}


function buildAIContext(){

  saveCurrentIntoMemory();

  const current =
    selectedPath
      ? getFile(selectedPath)
      : null;

  return {

    site:{
      id:siteId,
      name:site?.name || "",
      slug:site?.slug || ""
    },

    current_file:
      current
        ? {
            path:current.path,
            content:current.content || ""
          }
        : null,

    files:
      files
        .filter(
          file => !file.is_folder
        )
        .map(
          file => ({
            path:file.path,
            content:file.content || ""
          })
        )
  };
}


document
  .getElementById("aiPrompt")
  .addEventListener(
    "keydown",
    event => {

      if(
        event.key === "Enter" &&
        !event.shiftKey
      ){

        event.preventDefault();

        askAI();
      }
    }
  );

function formatCurrentFile(){

  if(!selectedPath) return;

  const path =
    selectedPath.toLowerCase();

  let text =
    editor.value;

  if(path.endsWith(".json")){

    try{

      text =
        JSON.stringify(
          JSON.parse(text),
          null,
          2
        );

    }catch{

      showStatus(
        "Invalid JSON."
      );

      return;
    }
  }

  if(path.endsWith(".html")){

    text =
      text
        .replace(/>\s+</g, ">\n<")
        .replace(/\n{3,}/g,"\n\n");
  }

  editor.value =
    text;

  saveCurrentIntoMemory();

  updateEditorInfo();

  updatePreview();

  showStatus(
    "File formatted."
  );
}


/* =========================================================
   DOWNLOAD PROJECT
   ========================================================= */

function downloadProject(){

  saveCurrentIntoMemory();

  if(!files.length){

    showStatus(
      "There are no files to download."
    );

    return;
  }

  /*
   * Create a simple HTML project package
   * without needing another library.
   */

  const payload =
    JSON.stringify(
      {
        planteer_project:true,
        site:site,
        files
      },
      null,
      2
    );

  const blob =
    new Blob(
      [payload],
      {
        type:"application/json"
      }
    );

  const url =
    URL.createObjectURL(blob);

  const a =
    document.createElement("a");

  a.href =
    url;

  a.download =
    (site?.slug || "planteer-project") +
    ".planteer.json";

  document.body.appendChild(a);

  a.click();

  a.remove();

  URL.revokeObjectURL(url);

  showStatus(
    "Project downloaded."
  );
}

function openCommandPalette(){

  document
    .getElementById("commandPanel")
    .classList.add("show");

  const search =
    document.getElementById(
      "commandSearch"
    );

  search.value = "";

  renderCommands("");

  setTimeout(
    () => search.focus(),
    20
  );
}


function closeCommandPalette(){

  document
    .getElementById("commandPanel")
    .classList.remove("show");
}


function renderCommands(filter){

  const list =
    document.getElementById(
      "commandList"
    );

  const lower =
    filter.toLowerCase();

  const matches =
    commands.filter(
      command =>
        command.title
          .toLowerCase()
          .includes(lower) ||
        command.description
          .toLowerCase()
          .includes(lower)
    );

  list.innerHTML =
    matches.map(
      (command,index) => `
        <div
          class="command"
          data-command="${index}"
        >
          <div class="command-title">
            ${escapeHTML(command.title)}
          </div>

          <div class="command-description">
            ${escapeHTML(command.description)}
          </div>
        </div>
      `
    ).join("");

  list
    .querySelectorAll(".command")
    .forEach(item => {

      item.addEventListener(
        "click",
        () => {

          const command =
            matches[
              Number(
                item.dataset.command
              )
            ];

          closeCommandPalette();

          command.action();
        }
      );
    });
}


document

  .addEventListener(
    "input",
    event => {
      renderCommands(
        event.target.value
      );
    }
  );


document

  .addEventListener(
    "click",
    event => {

      if(
        event.target.id ===
        "commandPanel"
      ){

  );


/* =========================================================
   SECURITY
   ========================================================= */

function escapeHTML(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


/* =========================================================
   KEYBOARD SHORTCUTS
   ========================================================= */

document.addEventListener(
  "keydown",
  event => {

    if(
      (event.ctrlKey || event.metaKey) &&
      event.key.toLowerCase() === "s"
    ){

      event.preventDefault();

      saveFile();
    }

    if(
      (event.ctrlKey || event.metaKey) &&
      event.key.toLowerCase() === "enter"
    ){

      event.preventDefault();

      deploySite();
    }

    if(
      (event.ctrlKey || event.metaKey) &&
      event.key.toLowerCase() === "p"
    ){

      event.preventDefault();

      refreshPreview();
    }

    if(
      (event.ctrlKey || event.metaKey) &&
      event.key.toLowerCase() === "k"
    ){

      event.preventDefault();

      openCommandPalette();
    }

    if(event.key === "Escape"){

      closeCommandPalette();

      closeModal();

      hideContextMenu();
    }
  }
);


/* =========================================================
   START
   ========================================================= */

loadSite();

</script>

</body>
</html>
