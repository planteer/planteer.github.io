<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planteer Builder</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Inter, Segoe UI, Arial, sans-serif;
      background: #070b12;
      color: #f4f7fb;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-rows: 58px 1fr;
    }

    .topbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 16px;
      border-bottom: 1px solid #202b39;
      background: #0b111a;
    }

    .logo {
      font-size: 21px;
      font-weight: 900;
    }

    .logo span {
      color: #55e68a;
    }

    .site-name {
      color: #91a0b4;
      font-size: 14px;
    }

    .top-actions {
      margin-left: auto;
      display: flex;
      gap: 8px;
    }

    .btn {
      border: 1px solid #2b394b;
      background: #111a25;
      color: #dce5ef;
      border-radius: 8px;
      padding: 8px 13px;
    }

    .btn:hover {
      background: #172230;
    }

    .btn.primary {
      border-color: #55e68a;
      background: #55e68a;
      color: #07100b;
      font-weight: 800;
    }

    .workspace {
      min-height: 0;
      display: grid;
      grid-template-columns: 220px minmax(300px, 1fr) minmax(320px, 42%);
    }

    .sidebar {
      min-width: 0;
      border-right: 1px solid #202b39;
      background: #0a1018;
      display: flex;
      flex-direction: column;
    }

    .sidebar-header {
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      border-bottom: 1px solid #202b39;
    }

    .sidebar-title {
      font-size: 12px;
      font-weight: 800;
      color: #91a0b4;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .file-actions {
      display: flex;
      gap: 4px;
    }

    .icon-btn {
      width: 29px;
      height: 29px;
      padding: 0;
      border-radius: 6px;
      border: 1px solid #263548;
      background: #111a25;
      color: #dce5ef;
    }

    .file-tree {
      min-height: 0;
      flex: 1;
      overflow: auto;
      padding: 8px;
    }

    .tree-item {
      display: flex;
      align-items: center;
      gap: 7px;
      width: 100%;
      padding: 7px 8px;
      border-radius: 6px;
      color: #b8c4d3;
      font-size: 13px;
      border: 0;
      background: transparent;
      text-align: left;
    }

    .tree-item:hover {
      background: #121c28;
    }

    .tree-item.selected {
      background: #172637;
      color: #55e68a;
    }

    .tree-folder {
      color: #d9c77a;
    }

    .editor {
      min-width: 0;
      display: grid;
      grid-template-rows: 42px 1fr;
      background: #080d14;
    }

    .tabs {
      min-width: 0;
      display: flex;
      overflow-x: auto;
      border-bottom: 1px solid #202b39;
    }

    .tab {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 13px;
      border-right: 1px solid #202b39;
      color: #8190a4;
      font-size: 12px;
      cursor: pointer;
      background: transparent;
      border-top: 0;
      border-bottom: 0;
      border-left: 0;
    }

    .tab.active {
      background: #0e1620;
      color: #f4f7fb;
    }

    .code-wrap {
      min-height: 0;
    }

    #codeEditor {
      width: 100%;
      height: 100%;
      resize: none;
      border: 0;
      outline: 0;
      padding: 18px;
      background: #080d14;
      color: #dce5ef;
      font-family: Consolas, Monaco, monospace;
      font-size: 14px;
      line-height: 1.6;
      tab-size: 2;
    }

    .preview {
      min-width: 0;
      min-height: 0;
      border-left: 1px solid #202b39;
      background: #0b111a;
      display: grid;
      grid-template-rows: 42px 1fr;
    }

    .preview-header {
      display: flex;
      align-items: center;
      padding: 0 12px;
      border-bottom: 1px solid #202b39;
      color: #91a0b4;
      font-size: 12px;
    }

    .preview-actions {
      margin-left: auto;
      display: flex;
      gap: 5px;
    }

    #previewFrame {
      width: 100%;
      height: 100%;
      border: 0;
      background: white;
    }

    .status {
      position: fixed;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      padding: 9px 15px;
      border: 1px solid #2b394b;
      border-radius: 9px;
      background: #101925;
      color: #dce5ef;
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s;
      z-index: 100;
    }

    .status.show {
      opacity: 1;
    }

    .ai-panel {
      position: fixed;
      right: 20px;
      bottom: 20px;
      width: min(430px, calc(100vw - 40px));
      height: min(560px, calc(100vh - 100px));
      display: none;
      grid-template-rows: 52px 1fr auto;
      border: 1px solid #2b394b;
      border-radius: 16px;
      background: #0b111a;
      box-shadow: 0 25px 80px rgba(0, 0, 0, .5);
      overflow: hidden;
      z-index: 50;
    }

    .ai-panel.open {
      display: grid;
    }

    .ai-header {
      display: flex;
      align-items: center;
      padding: 0 14px;
      border-bottom: 1px solid #202b39;
      font-weight: 800;
    }

    .ai-close {
      margin-left: auto;
      border: 0;
      background: transparent;
      color: #91a0b4;
      font-size: 20px;
    }

    .ai-messages {
      overflow-y: auto;
      padding: 14px;
    }

    .message {
      margin-bottom: 12px;
      padding: 11px;
      border-radius: 10px;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.5;
      font-size: 13px;
    }

    .message.user {
      background: #172637;
    }

    .message.ai {
      background: #111a25;
      border: 1px solid #202b39;
    }

    .ai-input {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      padding: 10px;
      border-top: 1px solid #202b39;
    }

    #aiPrompt {
      min-height: 42px;
      max-height: 120px;
      resize: vertical;
      padding: 10px;
      border: 1px solid #2b394b;
      border-radius: 8px;
      outline: none;
      background: #080d14;
      color: #f4f7fb;
    }

    .empty {
      padding: 30px;
      text-align: center;
      color: #66768a;
    }

    @media (max-width: 900px) {
      .workspace {
        grid-template-columns: 180px 1fr;
      }

      .preview {
        display: none;
      }
    }

    @media (max-width: 600px) {
      .workspace {
        grid-template-columns: 1fr;
      }

      .sidebar {
        display: none;
      }

      .site-name {
        display: none;
      }

      .top-actions .btn:not(.primary) {
        display: none;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <header class="topbar">
    <div class="logo">
      Planteer<span>.</span>
    </div>

    <div id="siteName" class="site-name">
      Loading site...
    </div>

    <div class="top-actions">
      <button class="btn" id="homeButton">
        Home
      </button>

      <button class="btn" id="aiButton">
        AI
      </button>

      <button class="btn" id="saveButton">
        Save
      </button>

      <button class="btn primary" id="publishButton">
        Publish
      </button>
    </div>
  </header>

  <main class="workspace">

    <aside class="sidebar">

      <div class="sidebar-header">
        <div class="sidebar-title">
          Files
        </div>

        <div class="file-actions">
          <button
            class="icon-btn"
            id="newFileButton"
            title="New file"
          >
            +
          </button>

          <button
            class="icon-btn"
            id="newFolderButton"
            title="New folder"
          >
            📁
          </button>
        </div>
      </div>

      <div
        id="fileTree"
        class="file-tree"
      ></div>

    </aside>

    <section class="editor">

      <div
        id="tabs"
        class="tabs"
      ></div>

      <div class="code-wrap">
        <textarea
          id="codeEditor"
          spellcheck="false"
          placeholder="Select a file..."
        ></textarea>
      </div>

    </section>

    <section class="preview">

      <div class="preview-header">
        Live Preview

        <div class="preview-actions">

          <button
            class="btn"
            id="refreshPreviewButton"
          >
            Refresh
          </button>

          <button
            class="btn"
            id="openPreviewButton"
          >
            Open
          </button>

        </div>
      </div>

      <iframe
        id="previewFrame"
        sandbox="allow-scripts allow-forms allow-modals allow-popups"
      ></iframe>

    </section>

  </main>

</div>

<div
  id="status"
  class="status"
></div>

<section
  id="aiPanel"
  class="ai-panel"
>

  <div class="ai-header">
    Planteer AI

    <button
      class="ai-close"
      id="closeAiButton"
    >
      ×
    </button>
  </div>

  <div
    id="aiMessages"
    class="ai-messages"
  >
    <div class="message ai">
      What would you like to change?
    </div>
  </div>

  <div class="ai-input">

    <textarea
      id="aiPrompt"
      placeholder="Ask Planteer AI..."
    ></textarea>

    <button
      class="btn primary"
      id="sendAiButton"
    >
      Send
    </button>

  </div>

</section>

<script>
  const API =
    "https://planteer.duncanhomeschool.workers.dev";

  const params =
    new URLSearchParams(
      window.location.search
    );

  const siteId =
    params.get("site");

  let site = null;

  let files = [];

  let currentFile = null;

  let dirty = false;

  let saveTimer = null;

  const siteName =
    document.getElementById(
      "siteName"
    );

  const fileTree =
    document.getElementById(
      "fileTree"
    );

  const tabs =
    document.getElementById(
      "tabs"
    );

  const codeEditor =
    document.getElementById(
      "codeEditor"
    );

  const previewFrame =
    document.getElementById(
      "previewFrame"
    );

  const status =
    document.getElementById(
      "status"
    );

  const aiPanel =
    document.getElementById(
      "aiPanel"
    );

  const aiMessages =
    document.getElementById(
      "aiMessages"
    );

  const aiPrompt =
    document.getElementById(
      "aiPrompt"
    );


  function showStatus(
    message
  ) {
    status.textContent =
      message;

    status.classList.add(
      "show"
    );

    clearTimeout(
      showStatus.timer
    );

    showStatus.timer =
      setTimeout(
        () => {
          status.classList.remove(
            "show"
          );
        },
        2600
      );
  }


  async function api(
    path,
    options = {}
  ) {
    const response =
      await fetch(
        API + path,
        {
          credentials: "include",
          ...options,
          headers: {
            "Content-Type":
              "application/json",
            ...(options.headers || {})
          }
        }
      );

    let data;

    try {
      data =
        await response.json();
    } catch {
      data = {};
    }

    if (!response.ok) {
      throw new Error(
        data.error ||
        `Request failed (${response.status})`
      );
    }

    return data;
  }


  async function loadSite() {
    if (!siteId) {
      throw new Error(
        "No site ID was supplied."
      );
    }

    showStatus(
      "Loading site..."
    );

    const data =
      await api(
        `/api/sites/${encodeURIComponent(siteId)}`
      );

    site =
      data.site;

    siteName.textContent =
      site.name +
      " • " +
      site.slug;

    files =
      Array.isArray(data.files)
        ? data.files.map(
            file => ({
              path: file.path,
              content:
                file.content || "",
              loaded: false,
              dirty: false
            })
          )
        : [];

    renderTree();

    if (files.length === 0) {
      showStatus(
        "No files found."
      );
      return;
    }

    const index =
      files.find(
        file =>
          file.path ===
          "index.html"
      );

    await selectFile(
      index ||
      files[0]
    );

    showStatus(
      "Site loaded."
    );
  }


  async function loadFileContent(
    file
  ) {
    if (
      file.loaded
    ) {
      return file.content;
    }

    const data =
      await api(
        `/api/sites/${encodeURIComponent(siteId)}/file?path=${encodeURIComponent(file.path)}`
      );

    file.content =
      data.file.content || "";

    file.loaded =
      true;

    return file.content;
  }


  function renderTree() {
    fileTree.innerHTML =
      "";

    if (
      files.length === 0
    ) {
      fileTree.innerHTML =
        `
        <div class="empty">
          No files yet.
        </div>
        `;

      return;
    }

    const sorted =
      [...files].sort(
        (a, b) =>
          a.path.localeCompare(
            b.path
          )
      );

    for (
      const file of sorted
    ) {
      const item =
        document.createElement(
          "button"
        );

      item.className =
        "tree-item";

      if (
        currentFile &&
        currentFile.path ===
          file.path
      ) {
        item.classList.add(
          "selected"
        );
      }

      const depth =
        file.path.split(
          "/"
        ).length - 1;

      item.style.paddingLeft =
        `${8 + depth * 18}px`;

      const icon =
        document.createElement(
          "span"
        );

      icon.textContent =
        getFileIcon(
          file.path
        );

      const label =
        document.createElement(
          "span"
        );

      label.textContent =
        file.path.split(
          "/"
        ).pop();

      item.appendChild(
        icon
      );

      item.appendChild(
        label
      );

      item.title =
        file.path;

      item.addEventListener(
        "click",
        () => {
          selectFile(file);
        }
      );

      item.addEventListener(
        "contextmenu",
        event => {
          event.preventDefault();

          fileMenu(
            file
          );
        }
      );

      fileTree.appendChild(
        item
      );
    }
  }


  function getFileIcon(
    path
  ) {
    const lower =
      path.toLowerCase();

    if (
      lower.endsWith(".html") ||
      lower.endsWith(".htm")
    ) {
      return "🌐";
    }

    if (
      lower.endsWith(".css")
    ) {
      return "🎨";
    }

    if (
      lower.endsWith(".js")
    ) {
      return "⚙";
    }

    if (
      lower.endsWith(".json")
    ) {
      return "{}";
    }

    if (
      lower.endsWith(".svg")
    ) {
      return "◇";
    }

    return "📄";
  }


  async function selectFile(
    file
  ) {
    if (
      currentFile &&
      currentFile !== file
    ) {
      currentFile.content =
        codeEditor.value;

      currentFile.dirty =
        dirty;
    }

    currentFile =
      file;

    try {
      await loadFileContent(
        file
      );

      codeEditor.value =
        file.content || "";

      dirty =
        !!file.dirty;

      renderTree();

      renderTabs();

      updatePreview();
    } catch (error) {
      showStatus(
        error.message
      );
    }
  }


  function renderTabs() {
    tabs.innerHTML =
      "";

    if (
      !currentFile
    ) {
      return;
    }

    const tab =
      document.createElement(
        "button"
      );

    tab.className =
      "tab active";

    tab.textContent =
      currentFile.path;

    if (
      dirty
    ) {
      tab.textContent +=
        " •";
    }

    tabs.appendChild(
      tab
    );
  }


  codeEditor.addEventListener(
    "input",
    () => {
      if (
        !currentFile
      ) {
        return;
      }

      currentFile.content =
        codeEditor.value;

      currentFile.loaded =
        true;

      currentFile.dirty =
        true;

      dirty =
        true;

      renderTabs();

      clearTimeout(
        saveTimer
      );

      saveTimer =
        setTimeout(
          () => {
            updatePreview();
          },
          350
        );
    }
  );


  codeEditor.addEventListener(
    "keydown",
    event => {
      if (
        event.key ===
          "Tab"
      ) {
        event.preventDefault();

        const start =
          codeEditor.selectionStart;

        const end =
          codeEditor.selectionEnd;

        codeEditor.value =
          codeEditor.value.substring(
            0,
            start
          ) +
          "  " +
          codeEditor.value.substring(
            end
          );

        codeEditor.selectionStart =
          start + 2;

        codeEditor.selectionEnd =
          start + 2;

        codeEditor.dispatchEvent(
          new Event(
            "input"
          )
        );
      }

      if (
        (event.ctrlKey ||
          event.metaKey) &&
        event.key.toLowerCase() ===
          "s"
      ) {
        event.preventDefault();

        saveCurrentFile();
      }
    }
  );


  async function saveCurrentFile() {
    if (
      !currentFile
    ) {
      showStatus(
        "Select a file first."
      );

      return;
    }

    currentFile.content =
      codeEditor.value;

    showStatus(
      "Saving..."
    );

    try {
      await api(
        `/api/sites/${encodeURIComponent(siteId)}/files`,
        {
          method: "POST",
          body:
            JSON.stringify({
              path:
                currentFile.path,
              content:
                currentFile.content
            })
        }
      );

      currentFile.loaded =
        true;

      currentFile.dirty =
        false;

      dirty =
        false;

      renderTabs();

      showStatus(
        "Saved to GitHub storage."
      );

      updatePreview();
    } catch (error) {
      showStatus(
        "Save failed: " +
        error.message
      );
    }
  }


  async function saveAllFiles() {
    if (
      currentFile
    ) {
      currentFile.content =
        codeEditor.value;

      currentFile.dirty =
        dirty;
    }

    const pending =
      files.filter(
        file =>
          file.dirty
      );

    if (
      pending.length ===
      0
    ) {
      return;
    }

    showStatus(
      `Saving ${pending.length} file(s)...`
    );

    for (
      const file of pending
    ) {
      await api(
        `/api/sites/${encodeURIComponent(siteId)}/files`,
        {
          method: "POST",
          body:
            JSON.stringify({
              path:
                file.path,
              content:
                file.content
            })
        }
      );

      file.dirty =
        false;
    }

    dirty =
      false;

    renderTabs();

    showStatus(
      "All changes saved."
    );
  }


  async function createFile() {
    const path =
      prompt(
        "New file path:",
        "about.html"
      );

    if (
      !path
    ) {
      return;
    }

    const clean =
      normalizeClientPath(
        path
      );

    if (
      !clean
    ) {
      alert(
        "Invalid file path."
      );

      return;
    }

    if (
      files.some(
        file =>
          file.path ===
          clean
      )
    ) {
      alert(
        "That file already exists."
      );

      return;
    }

    const file = {
      path: clean,
      content: "",
      loaded: true,
      dirty: true
    };

    files.push(
      file
    );

    renderTree();

    await selectFile(
      file
    );

    await saveCurrentFile();
  }


  async function createFolder() {
    const folder =
      prompt(
        "Folder path:",
        "images"
      );

    if (
      !folder
    ) {
      return;
    }

    const clean =
      normalizeClientPath(
        folder
      );

    if (
      !clean
    ) {
      alert(
        "Invalid folder path."
      );

      return;
    }

    const path =
      clean +
      "/.gitkeep";

    if (
      files.some(
        file =>
          file.path ===
          path
      )
    ) {
      alert(
        "That folder already exists."
      );

      return;
    }

    const file = {
      path,
      content: "",
      loaded: true,
      dirty: true
    };

    files.push(
      file
    );

    renderTree();

    await selectFile(
      file
    );

    await saveCurrentFile();

    showStatus(
      "Folder created."
    );
  }


  async function renameCurrentFile() {
    if (
      !currentFile
    ) {
      return;
    }

    const newPath =
      prompt(
        "New file path:",
        currentFile.path
      );

    if (
      !newPath ||
      newPath ===
        currentFile.path
    ) {
      return;
    }

    const clean =
      normalizeClientPath(
        newPath
      );

    if (
      !clean
    ) {
      alert(
        "Invalid path."
      );

      return;
    }

    if (
      files.some(
        file =>
          file !==
            currentFile &&
          file.path ===
            clean
      )
    ) {
      alert(
        "A file with that name already exists."
      );

      return;
    }

    const oldPath =
      currentFile.path;

    currentFile.path =
      clean;

    try {
      await api(
        `/api/sites/${encodeURIComponent(siteId)}/files/${encodeURIComponent(oldPath)}`,
        {
          method: "DELETE"
        }
      );

      await api(
        `/api/sites/${encodeURIComponent(siteId)}/files`,
        {
          method: "POST",
          body:
            JSON.stringify({
              path: clean,
              content:
                currentFile.content
            })
        }
      );

      renderTree();

      renderTabs();

      showStatus(
        "File renamed."
      );
    } catch (error) {
      currentFile.path =
        oldPath;

      renderTree();

      showStatus(
        "Rename failed: " +
        error.message
      );
    }
  }


  async function deleteCurrentFile() {
    if (
      !currentFile
    ) {
      return;
    }

    if (
      currentFile.path ===
      "index.html"
    ) {
      alert(
        "index.html is required for publishing and cannot be deleted."
      );

      return;
    }

    const confirmed =
      confirm(
        `Delete ${currentFile.path}?`
      );

    if (
      !confirmed
    ) {
      return;
    }

    const deleting =
      currentFile;

    try {
      await api(
        `/api/sites/${encodeURIComponent(siteId)}/files/${encodeURIComponent(deleting.path)}`,
        {
          method: "DELETE"
        }
      );

      files =
        files.filter(
          file =>
            file !==
            deleting
        );

      currentFile =
        null;

      codeEditor.value =
        "";

      dirty =
        false;

      renderTree();

      renderTabs();

      const next =
        files.find(
          file =>
            file.path ===
            "index.html"
        ) ||
        files[0];

      if (
        next
      ) {
        await selectFile(
          next
        );
      }

      showStatus(
        "File deleted."
      );
    } catch (error) {
      showStatus(
        "Delete failed: " +
        error.message
      );
    }
  }


  function fileMenu(
    file
  ) {
    selectFile(
      file
    );

    setTimeout(
      () => {
        const action =
          prompt(
            `File: ${file.path}\n\nType:\nrename\nor\ndelete`
          );

        if (
          action ===
          "rename"
        ) {
          renameCurrentFile();
        }

        if (
          action ===
          "delete"
        ) {
          deleteCurrentFile();
        }
      },
      50
    );
  }


  function normalizeClientPath(
    value
  ) {
    let path =
      String(
        value || ""
      )
        .replace(
          /\\/g,
          "/"
        )
        .replace(
          /^\/+/,
          ""
        )
        .trim();

    if (
      !path ||
      path.includes("..") ||
      path.includes("\0")
    ) {
      return null;
    }

    if (
      path.length >
      240
    ) {
      return null;
    }

    return path;
  }


  function updatePreview() {
    const index =
      files.find(
        file =>
          file.path ===
          "index.html"
      );

    if (
      !index ||
      !index.loaded
    ) {
      return;
    }

    let html =
      index.content || "";

    const base =
      document.baseURI;

    html =
      html.replace(
        /<head([^>]*)>/i,
        `<head$1><base href="${escapeAttribute(base)}">`
      );

    previewFrame.srcdoc =
      html;
  }


  function refreshPreview() {
    updatePreview();

    showStatus(
      "Preview refreshed."
    );
  }


  function openPreview() {
    const url =
      `${API}/site/${encodeURIComponent(site.slug)}/index.html`;

    window.open(
      url,
      "_blank",
      "noopener"
    );
  }


  async function publishSite() {
    try {
      await saveAllFiles();

      showStatus(
        "Publishing..."
      );

      const data =
        await api(
          `/api/sites/${encodeURIComponent(siteId)}/publish`,
          {
            method: "POST",
            body: "{}"
          }
        );

      const url =
        data.url;

      const message =
        `Published!\n\n${url}\n\nOpen the published website?`;

      if (
        confirm(message)
      ) {
        window.open(
          url,
          "_blank",
          "noopener"
        );
      }

      showStatus(
        "Website published."
      );
    } catch (error) {
      showStatus(
        "Publish failed: " +
        error.message
      );
    }
  }


  function addAIMessage(
    type,
    text
  ) {
    const message =
      document.createElement(
        "div"
      );

    message.className =
      `message ${type}`;

    message.textContent =
      text;

    aiMessages.appendChild(
      message
    );

    aiMessages.scrollTop =
      aiMessages.scrollHeight;
  }


  async function askAI() {
    const prompt =
      aiPrompt.value.trim();

    if (
      !prompt
    ) {
      return;
    }

    addAIMessage(
      "user",
      prompt
    );

    aiPrompt.value =
      "";

    addAIMessage(
      "ai",
      "Thinking..."
    );

    const thinking =
      aiMessages.lastElementChild;

    try {
      let action =
        "chat";

      let body = {
        action,
        prompt
      };

      if (
        currentFile
      ) {
        body =
          {
            action:
              "edit-file",
            path:
              currentFile.path,
            content:
              codeEditor.value,
            prompt
          };
      }

      const data =
        await api(
          "/api/ai",
          {
            method: "POST",
            body:
              JSON.stringify(
                body
              )
          }
        );

      thinking.textContent =
        data.response ||
        "No response.";

      if (
        currentFile &&
        body.action ===
          "edit-file"
      ) {
        const replacement =
          String(
            data.response ||
            ""
          ).trim();

        if (
          replacement
        ) {
          const shouldApply =
            confirm(
              `Apply Planteer AI's replacement to ${currentFile.path}?`
            );

          if (
            shouldApply
          ) {
            currentFile.content =
              replacement;

            currentFile.loaded =
              true;

            currentFile.dirty =
              true;

            dirty =
              true;

            codeEditor.value =
              replacement;

            renderTabs();

            updatePreview();

            showStatus(
              "AI change applied. Save when ready."
            );
          }
        }
      }
    } catch (error) {
      thinking.textContent =
        "AI error: " +
        error.message;
    }
  }


  function escapeAttribute(
    value
  ) {
    return String(
      value
    )
      .replace(
        /&/g,
        "&amp;"
      )
      .replace(
        /"/g,
        "&quot;"
      )
      .replace(
        /</g,
        "&lt;"
      )
      .replace(
        />/g,
        "&gt;"
      );
  }


  document
    .getElementById(
      "homeButton"
    )
    .addEventListener(
      "click",
      () => {
        if (
          dirty &&
          !confirm(
            "You have unsaved changes. Leave anyway?"
          )
        ) {
          return;
        }

        window.location.href =
          "index.html";
      }
    );


  document
    .getElementById(
      "saveButton"
    )
    .addEventListener(
      "click",
      saveCurrentFile
    );


  document
    .getElementById(
      "publishButton"
    )
    .addEventListener(
      "click",
      publishSite
    );


  document
    .getElementById(
      "newFileButton"
    )
    .addEventListener(
      "click",
      createFile
    );


  document
    .getElementById(
      "newFolderButton"
    )
    .addEventListener(
      "click",
      createFolder
    );


  document
    .getElementById(
      "refreshPreviewButton"
    )
    .addEventListener(
      "click",
      refreshPreview
    );


  document
    .getElementById(
      "openPreviewButton"
    )
    .addEventListener(
      "click",
      openPreview
    );


  document
    .getElementById(
      "aiButton"
    )
    .addEventListener(
      "click",
      () => {
        aiPanel.classList.add(
          "open"
        );

        aiPrompt.focus();
      }
    );


  document
    .getElementById(
      "closeAiButton"
    )
    .addEventListener(
      "click",
      () => {
        aiPanel.classList.remove(
          "open"
        );
      }
    );


  document
    .getElementById(
      "sendAiButton"
    )
    .addEventListener(
      "click",
      askAI
    );


  aiPrompt.addEventListener(
    "keydown",
    event => {
      if (
        event.key ===
          "Enter" &&
        !event.shiftKey
      ) {
        event.preventDefault();

        askAI();
      }
    }
  );


  window.addEventListener(
    "beforeunload",
    event => {
      if (
        dirty
      ) {
        event.preventDefault();
        event.returnValue =
          "";
      }
    }
  );


  loadSite()
    .catch(
      error => {
        siteName.textContent =
          "Builder error";

        fileTree.innerHTML =
          `
          <div class="empty">
            ${escapeHTML(
              error.message
            )}
          </div>
          `;

        showStatus(
          error.message
        );
      }
    );
</script>

</body>
</html>
