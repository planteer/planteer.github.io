<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Planteer</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #site {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }
  </style>
</head>

<body>

<iframe
  id="site"
  title="Planteer Website"
></iframe>

<script>

  const path =
    window.location.pathname;

  const parts =
    path
      .split("/")
      .filter(Boolean);


  /*
  Planteer system pages
  */

  const ownPages = [
    "dashboard.html",
    "create.html",
    "editor.html",
    "index.html"
  ];


  /*
  Don't use the website
  loader for Planteer's own pages.
  */

  if (
    parts.length === 1 &&
    ownPages.includes(parts[0])
  ) {

    window.location.replace(
      "/" + parts[0]
    );

  } else if (
    parts.length >= 1
  ) {

    /*
    First path component is
    the Planteer website name.
    */

    const siteName =
      parts[0];


    /*
    Anything after the site name
    is a file/path on that website.

    Example:

    /my-first-site/about.html

    becomes:

    /site/my-first-site/about.html
    */

    const remainingPath =
      parts
        .slice(1)
        .join("/");


    let destination =
      "https://hard-planet-hosting.josiahdduncan.workers.dev/site/" +
      encodeURIComponent(siteName) +
      "/";


    if (remainingPath) {

      destination +=
        remainingPath;

    }


    /*
    Load the Guacamole website
    inside the page.

    The browser stays at:

    planteer.github.io/my-first-site/

    */

    document
      .getElementById("site")
      .src = destination;

  } else {

    window.location.replace("/");

  }

</script>

</body>
</html>
