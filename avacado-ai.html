<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Avocado AI</title>

<style>
/* ——— YOUR ORIGINAL STYLES (unchanged) ——— */
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0; width: 100%; min-height: 100%;
  font-family: Segoe UI, Arial, sans-serif;
  background: #05070b; color: #eee;
}
body { min-height: 100vh; overflow-x: hidden; }
body::before {
  content: ""; position: fixed; inset: 0; pointer-events: none;
  background:
    radial-gradient(circle at 20% 20%, rgba(53,255,136,.08), transparent 25%),
    radial-gradient(circle at 80% 80%, rgba(80,140,255,.08), transparent 25%);
  z-index: -1;
}
button, textarea, input { font: inherit; }
button { cursor: pointer; }

.app { min-height: 100vh; display: grid; grid-template-columns: 280px minmax(0, 1fr); }
.sidebar {
  min-height: 100vh; background: #090d13; border-right: 1px solid #1b2835;
  padding: 18px; display: flex; flex-direction: column; overflow: hidden;
}
.sidebar-header { display: flex; align-items: center; gap: 11px; margin-bottom: 20px; }
.mini-avocado {
  width: 42px; height: 42px; border-radius: 50%; background: #35ff88;
  color: #06130b; display: grid; place-items: center; font-size: 22px; font-weight: 900;
}
.sidebar-title { font-weight: 900; font-size: 17px; }
.sidebar-subtitle { color: #718499; font-size: 11px; margin-top: 2px; }
.sidebar-section-title {
  color: #6f8296; font-size: 11px; font-weight: 800; text-transform: uppercase;
  letter-spacing: .08em; margin: 8px 4px;
}
.website-list { flex: 1; overflow-y: auto; padding-right: 3px; }
.website-item {
  width: 100%; text-align: left; border: 1px solid transparent;
  background: transparent; color: #dce5ed; border-radius: 11px;
  padding: 11px; margin-bottom: 6px; display: block;
}
.website-item:hover { background: #101821; border-color: #1d2c3b; }
.website-name { font-weight: 700; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.website-meta { color: #6f8296; font-size: 11px; margin-top: 4px; }

.sidebar-bottom { border-top: 1px solid #1b2835; padding-top: 14px; margin-top: 12px; }
.sidebar-button {
  width: 100%; border: 1px solid #263646; background: #101721;
  color: #dfe7ef; border-radius: 10px; padding: 10px; margin-top: 7px;
}
.sidebar-button:hover { border-color: #35ff88; }

.main { min-width: 0; min-height: 100vh; display: flex; flex-direction: column; }
.header {
  display: flex; align-items: center; justify-content: space-between; gap: 15px;
  padding: 18px 22px; border-bottom: 1px solid #1b2835;
  background: rgba(9,13,19,.94); position: sticky; top: 0; z-index: 10;
}
.logo { display: flex; align-items: center; gap: 12px; }
.avocado {
  width: 45px; height: 45px; border-radius: 50%; background: #35ff88;
  display: grid; place-items: center; color: #07140d; font-size: 24px; font-weight: 900;
}
.title { font-size: 21px; font-weight: 800; }
.subtitle { color: #9fb2c5; font-size: 13px; margin-top: 3px; }

.controls { display: flex; align-items: center; gap: 9px; }
.status { font-size: 12px; color: #35ff88; }

#clearButton {
  min-width: auto; padding: 9px 13px; background: #18222d;
  color: #eee; border: 1px solid #263646; border-radius: 10px;
}
#clearButton:hover { border-color: #35ff88; }

.chat {
  width: min(1050px, 100%); flex: 1; margin: 0 auto;
  padding: 25px 22px 140px;
}

.message { display: flex; margin: 15px 0; }
.message.user { justify-content: flex-end; }
.bubble {
  max-width: min(820px, 90%); padding: 14px 17px; border-radius: 17px;
  line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere;
}
.message.ai .bubble { background: #10151f; border: 1px solid #1d2a38; }
.message.user .bubble { background: #35ff88; color: #06130b; }

.composer-wrap {
  position: fixed; bottom: 0; left: 280px; right: 0;
  padding: 14px 22px 18px;
  background: linear-gradient(transparent, #05070b 25%);
  z-index: 20;
}
.composer {
  width: min(1050px, 100%); margin: 0 auto; display: flex; gap: 10px;
  padding: 12px; background: rgba(16,21,31,.97);
  border: 1px solid #1c2936; border-radius: 18px;
}
#prompt {
  flex: 1; min-width: 0; resize: none; min-height: 50px; max-height: 180px;
  padding: 14px; border: 1px solid #263646; border-radius: 12px;
  background: #080c12; color: #eee;
}
#prompt:focus { border-color: #35ff88; }

#sendButton {
  border: 0; border-radius: 12px; padding: 0 20px;
  background: #35ff88; color: #06130b; font-weight: 800; min-width: 90px;
}
#sendButton:disabled { opacity: .55; cursor: not-allowed; }
</style>
</head>

<body>

<div class="app">

<!-- ——— SIDEBAR ——— -->
<aside class="sidebar">
  <div class="sidebar-header">
    <div class="mini-avocado">🥑</div>
    <div>
      <div class="sidebar-title">Avocado AI</div>
      <div class="sidebar-subtitle">Your websites</div>
    </div>
  </div>

  <div class="sidebar-section-title">Websites</div>
  <div class="website-list" id="websiteList">
    <button class="website-item"><div class="website-name">oreo-fatty</div><div class="website-meta">Published</div></button>
    <button class="website-item"><div class="website-name">my-sweetgis</div><div class="website-meta">Not published</div></button>
    <button class="website-item"><div class="website-name">cat-website</div><div class="website-meta">Not published</div></button>
  </div>

  <div class="sidebar-bottom">
    <button class="sidebar-button" id="refreshWebsites">Refresh websites</button>
    <button class="sidebar-button" id="newChatButton">New chat</button>
  </div>
</aside>

<!-- ——— MAIN ——— -->
<main class="main">

<header class="header">
  <div class="logo">
    <div class="avocado">🥑</div>
    <div>
      <div class="title">Avocado AI</div>
      <div class="subtitle">The Hard Planet AI</div>
    </div>
  </div>

  <div class="controls">
    <div class="status" id="status">Online</div>
    <button id="clearButton">Clear</button>
  </div>
</header>

<div class="chat" id="chat"></div>

</main>
</div>

<!-- ——— COMPOSER ——— -->
<div class="composer-wrap">
  <div class="composer">
    <textarea id="prompt" placeholder="Ask Avocado AI anything..."></textarea>
    <button id="sendButton">Send</button>
  </div>
</div>

<!-- ——— WORKING OPENROUTER AI SCRIPT ——— -->
<script>
  const API_KEY = "sk-or-v1-PASTE_YOUR_KEY_HERE";

  const chatEl = document.getElementById("chat");
  const promptEl = document.getElementById("prompt");
  const sendBtn = document.getElementById("sendButton");
  const clearBtn = document.getElementById("clearButton");
  const statusEl = document.getElementById("status");

  function addMessage(role, text) {
    const msg = document.createElement("div");
    msg.className = "message " + role;

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;

    msg.appendChild(bubble);
    chatEl.appendChild(msg);
    chatEl.scrollTop = chatEl.scrollHeight;
  }

  async function send() {
    const text = promptEl.value.trim();
    if (!text) return;

    addMessage("user", text);
    promptEl.value = "";
    sendBtn.disabled = true;
    statusEl.textContent = "Thinking…";

    try {
      const res = await fetch("https://openrouter.ai/api/v1/chat/completions", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + API_KEY
        },
        body: JSON.stringify({
          model: "openrouter/free",
          messages: [
            { role: "user", content: text }
          ]
        })
      });

      const data = await res.json();
      const aiText = data.choices?.[0]?.message?.content || "Avocado AI error: no response.";
      addMessage("ai", aiText);
    } catch (e) {
      addMessage("ai", "Avocado AI error: " + e.message);
    } finally {
      sendBtn.disabled = false;
      statusEl.textContent = "Online";
    }
  }

  sendBtn.addEventListener("click", send);

  promptEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      send();
    }
  });

  clearBtn.addEventListener("click", () => {
    chatEl.innerHTML = "";
  });
</script>

</body>
</html>
