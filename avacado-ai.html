<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Avocado AI</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  font-family: Segoe UI, Arial, sans-serif;
  background: #05070b;
  color: #eee;
}

body {
  min-height: 100vh;
  overflow-x: hidden;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background:
    radial-gradient(circle at 20% 20%, rgba(53,255,136,.08), transparent 25%),
    radial-gradient(circle at 80% 80%, rgba(80,140,255,.08), transparent 25%);
  z-index: -1;
}

button,
textarea,
input {
  font: inherit;
}

button {
  cursor: pointer;
}

.app {
  min-height: 100vh;
  display: grid;
  grid-template-columns: 280px minmax(0, 1fr);
}

.sidebar {
  min-height: 100vh;
  background: #090d13;
  border-right: 1px solid #1b2835;
  padding: 18px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.sidebar-header {
  display: flex;
  align-items: center;
  gap: 11px;
  margin-bottom: 20px;
}

.mini-avocado {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: #35ff88;
  color: #06130b;
  display: grid;
  place-items: center;
  font-size: 22px;
  font-weight: 900;
}

.sidebar-title {
  font-weight: 900;
  font-size: 17px;
}

.sidebar-subtitle {
  color: #718499;
  font-size: 11px;
  margin-top: 2px;
}

.sidebar-section-title {
  color: #6f8296;
  font-size: 11px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: .08em;
  margin: 8px 4px;
}

.website-list {
  flex: 1;
  overflow-y: auto;
  padding-right: 3px;
}

.website-empty {
  color: #718499;
  font-size: 13px;
  line-height: 1.5;
  padding: 10px 4px;
}

.website-item {
  width: 100%;
  text-align: left;
  border: 1px solid transparent;
  background: transparent;
  color: #dce5ed;
  border-radius: 11px;
  padding: 11px;
  margin-bottom: 6px;
  display: block;
}

.website-item:hover {
  background: #101821;
  border-color: #1d2c3b;
}

.website-name {
  font-weight: 700;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.website-meta {
  color: #6f8296;
  font-size: 11px;
  margin-top: 4px;
}

.sidebar-bottom {
  border-top: 1px solid #1b2835;
  padding-top: 14px;
  margin-top: 12px;
}

.sidebar-button {
  width: 100%;
  border: 1px solid #263646;
  background: #101721;
  color: #dfe7ef;
  border-radius: 10px;
  padding: 10px;
  margin-top: 7px;
}

.sidebar-button:hover {
  border-color: #35ff88;
}

.main {
  min-width: 0;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
  padding: 18px 22px;
  border-bottom: 1px solid #1b2835;
  background: rgba(9,13,19,.94);
  position: sticky;
  top: 0;
  z-index: 10;
}

.logo {
  display: flex;
  align-items: center;
  gap: 12px;
}

.avocado {
  width: 45px;
  height: 45px;
  border-radius: 50%;
  background: #35ff88;
  display: grid;
  place-items: center;
  color: #07140d;
  font-size: 24px;
  font-weight: 900;
}

.title {
  font-size: 21px;
  font-weight: 800;
}

.subtitle {
  color: #9fb2c5;
  font-size: 13px;
  margin-top: 3px;
}

.controls {
  display: flex;
  align-items: center;
  gap: 9px;
}

.status {
  font-size: 12px;
  color: #35ff88;
}

#clearButton {
  min-width: auto;
  padding: 9px 13px;
  background: #18222d;
  color: #eee;
  border: 1px solid #263646;
  border-radius: 10px;
}

#clearButton:hover {
  border-color: #35ff88;
}

.chat {
  width: min(1050px, 100%);
  flex: 1;
  margin: 0 auto;
  padding: 25px 22px 140px;
}

.message {
  display: flex;
  margin: 15px 0;
}

.message.user {
  justify-content: flex-end;
}

.bubble {
  max-width: min(820px, 90%);
  padding: 14px 17px;
  border-radius: 17px;
  line-height: 1.55;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.message.ai .bubble {
  background: #10151f;
  border: 1px solid #1d2a38;
}

.message.user .bubble {
  background: #35ff88;
  color: #06130b;
}

.thinking-bubble {
  display: flex;
  align-items: center;
  gap: 9px;
  min-width: 190px;
}

.thinking-label {
  color: #9fb2c5;
  font-style: italic;
}

.thinking-dots {
  display: flex;
  align-items: center;
  gap: 4px;
  height: 18px;
}

.thinking-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #35ff88;
  animation: avocadoThinking 1.2s infinite ease-in-out;
}

.thinking-dot:nth-child(1) {
  animation-delay: 0s;
}

.thinking-dot:nth-child(2) {
  animation-delay: .15s;
}

.thinking-dot:nth-child(3) {
  animation-delay: .3s;
}

@keyframes avocadoThinking {
  0%,
  60%,
  100% {
    transform: translateY(0);
    opacity: .35;
  }

  30% {
    transform: translateY(-5px);
    opacity: 1;
  }
}

.website-card {
  width: min(850px, 100%);
  margin-top: 12px;
  border: 1px solid #243443;
  border-radius: 15px;
  background: #0b1118;
  overflow: hidden;
}

.website-card-header {
  padding: 13px 15px;
  border-bottom: 1px solid #1b2835;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}

.website-card-title {
  font-weight: 800;
}

.website-card-status {
  font-size: 11px;
  color: #35ff88;
}

.website-card-body {
  padding: 14px;
}

.website-description {
  color: #a8b8c8;
  font-size: 13px;
  margin-bottom: 12px;
}

.website-link {
  display: block;
  color: #35ff88;
  text-decoration: none;
  background: #07100b;
  border: 1px solid #1f4730;
  border-radius: 10px;
  padding: 11px;
  overflow-wrap: anywhere;
}

.website-link:hover {
  background: #0b1810;
}

.website-files {
  margin-top: 13px;
}

.website-files-title {
  color: #718499;
  text-transform: uppercase;
  font-size: 10px;
  font-weight: 900;
  letter-spacing: .08em;
  margin-bottom: 7px;
}

.file-row {
  display: flex;
  align-items: center;
  gap: 9px;
  background: #101720;
  border: 1px solid #1c2a38;
  border-radius: 9px;
  padding: 8px 10px;
  margin-top: 5px;
}

.file-icon {
  font-size: 14px;
}

.file-name {
  font-family: Consolas, monospace;
  color: #dfe7ef;
  overflow-wrap: anywhere;
}

.file-type {
  margin-left: auto;
  color: #6f8296;
  font-size: 11px;
  white-space: nowrap;
}

.website-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin-top: 13px;
}

.website-action {
  border: 1px solid #263646;
  background: #131d27;
  color: #dce5ed;
  border-radius: 9px;
  padding: 8px 11px;
  font-size: 12px;
}

.website-action:hover {
  border-color: #35ff88;
}

.image-card {
  margin-top: 12px;
  padding: 10px;
  background: #0c1119;
  border: 1px solid #253342;
  border-radius: 16px;
  width: min(850px, 100%);
}

.image-card img {
  display: block;
  width: 100%;
  max-height: 700px;
  object-fit: contain;
  border-radius: 10px;
  background: #05070b;
}

.image-label {
  color: #9fb2c5;
  font-size: 12px;
  margin-top: 8px;
}

/* LIVE PREVIEW */

.preview-card {
  width: min(900px, 100%);
  margin-top: 14px;
  background: #090f16;
  border: 1px solid #294052;
  border-radius: 16px;
  overflow: hidden;
}

.preview-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 13px 15px;
  border-bottom: 1px solid #1d2b38;
}

.preview-title {
  font-weight: 800;
}

.preview-status {
  color: #35ff88;
  font-size: 12px;
}

.preview-frame-wrap {
  background: #05070b;
  padding: 10px;
}

.preview-frame {
  display: block;
  width: 100%;
  height: 550px;
  border: 1px solid #263646;
  border-radius: 10px;
  background: white;
}

.preview-url {
  padding: 10px 14px;
  color: #718499;
  font-size: 11px;
  overflow-wrap: anywhere;
}

.preview-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  padding: 12px 14px;
  border-top: 1px solid #1d2b38;
}

.preview-button {
  border: 1px solid #263646;
  background: #131d27;
  color: #dce5ed;
  border-radius: 9px;
  padding: 9px 13px;
}

.preview-button:hover {
  border-color: #35ff88;
}

.preview-approve {
  background: #35ff88;
  color: #06130b;
  border-color: #35ff88;
  font-weight: 800;
}

.preview-reject {
  background: #261419;
  border-color: #5a2833;
}

.preview-open {
  margin-left: auto;
}

.composer-wrap {
  position: fixed;
  bottom: 0;
  left: 280px;
  right: 0;
  padding: 14px 22px 18px;
  background: linear-gradient(
    transparent,
    #05070b 25%
  );
  z-index: 20;
}

.composer {
  width: min(1050px, 100%);
  margin: 0 auto;
  display: flex;
  gap: 10px;
  padding: 12px;
  background: rgba(16,21,31,.97);
  border: 1px solid #1c2936;
  border-radius: 18px;
  box-shadow: 0 -10px 40px rgba(0,0,0,.25);
}

#prompt {
  flex: 1;
  min-width: 0;
  resize: none;
  min-height: 50px;
  max-height: 180px;
  padding: 14px;
  border: 1px solid #263646;
  border-radius: 12px;
  outline: none;
  background: #080c12;
  color: #eee;
}

#prompt:focus {
  border-color: #35ff88;
}

#sendButton {
  border: 0;
  border-radius: 12px;
  padding: 0 20px;
  background: #35ff88;
  color: #06130b;
  font-weight: 800;
  min-width: 90px;
}

#sendButton:disabled {
  opacity: .55;
  cursor: not-allowed;
}

@media (max-width: 800px) {
  .app {
    grid-template-columns: 1fr;
  }

  .sidebar {
    display: none;
  }

  .composer-wrap {
    left: 0;
  }

  .header {
    padding: 14px;
  }

  .chat {
    padding-left: 14px;
    padding-right: 14px;
  }

  .composer-wrap {
    padding-left: 10px;
    padding-right: 10px;
  }

  .preview-frame {
    height: 450px;
  }
}

@media (max-width: 600px) {
  .status {
    display: none;
  }

  .composer {
    flex-direction: column;
  }

  #sendButton {
    min-height: 48px;
  }

  .bubble {
    max-width: 95%;
  }

  .website-card-header {
    align-items: flex-start;
    flex-direction: column;
  }

  .file-type {
    display: none;
  }

  .preview-frame {
    height: 400px;
  }

  .preview-open {
    margin-left: 0;
  }
}
</style>
</head>

<body>

<div class="app">

<aside class="sidebar">

<div class="sidebar-header">
<div class="mini-avocado">🥑</div>

<div>
<div class="sidebar-title">Avocado AI</div>
<div class="sidebar-subtitle">Your websites</div>
</div>
</div>

<div class="sidebar-section-title">
Websites
</div>

<div class="website-list" id="websiteList">
<div class="website-empty">
Sign in and create a website with Avocado AI to see it here.
</div>
</div>

<div class="sidebar-bottom">

<button class="sidebar-button" id="refreshWebsites" type="button">
Refresh websites
</button>

<button class="sidebar-button" id="newChatButton" type="button">
New chat
</button>

</div>

</aside>

<main class="main">

<header class="header">

<div class="logo">

<div class="avocado">🥑</div>

<div>
<div class="title">Avocado AI</div>
<div class="subtitle">
The Hard Planet AI
</div>
</div>

</div>

<div class="controls">

<div class="status" id="status">
Online
</div>

<button id="clearButton" type="button">
Clear
</button>

</div>

</header>

<main class="chat" id="chat"></main>

</main>

</div>

<div class="composer-wrap">

<form class="composer" id="composer">

<textarea
id="prompt"
placeholder="Talk to Avocado AI..."
autocomplete="off"
></textarea>

<button id="sendButton" type="submit">
Send
</button>

</form>

</div>

<script>

const WORKER_URL =
"https://hard-planet-hosting.josiahdduncan.workers.dev";

const PLANTEER_BASE =
"https://planteer.github.io/";

const AI_ENDPOINT =
WORKER_URL + "/api/ai";

const IMAGE_ENDPOINT =
WORKER_URL + "/api/image";

const WEBSITES_ENDPOINT =
WORKER_URL + "/api/websites";

/*
  Preview endpoints.

  The AI endpoint can return either:
  preview_url / previewUrl
  OR
  preview_html / previewHtml
  OR
  website.preview_url
  OR
  website.preview_html
*/

const PREVIEW_ENDPOINT =
WORKER_URL + "/api/preview";

const chat =
document.getElementById("chat");

const composer =
document.getElementById("composer");

const promptBox =
document.getElementById("prompt");

const sendButton =
document.getElementById("sendButton");

const clearButton =
document.getElementById("clearButton");

const statusText =
document.getElementById("status");

const websiteList =
document.getElementById("websiteList");

const refreshWebsites =
document.getElementById("refreshWebsites");

const newChatButton =
document.getElementById("newChatButton");

let history = [];

let websites = [];

let thinkingTimer = null;

let thinkingStartTime = 0;

/*
============================================================
LOCAL HISTORY
============================================================
*/

function saveHistory() {

try {

localStorage.setItem(
"avocado_ai_history",
JSON.stringify(history)
);

} catch {}

}

function loadHistory() {

try {

const saved =
localStorage.getItem(
"avocado_ai_history"
);

if (!saved) return;

const parsed =
JSON.parse(saved);

if (!Array.isArray(parsed)) return;

history = parsed;

for (const item of history) {

if (item.type === "user") {

addUserMessage(
item.text,
false
);

}

if (item.type === "ai") {

addAIMessage(
item.text || "",
item.image || null,
item.website || null,
item.preview || null,
false
);

}

}

} catch {}

}

function scrollChat() {

setTimeout(function() {

window.scrollTo({
top: document.body.scrollHeight,
behavior: "smooth"
});

}, 20);

}

/*
============================================================
MESSAGES
============================================================
*/

function addUserMessage(
text,
save = true
) {

const wrapper =
document.createElement("div");

wrapper.className =
"message user";

const bubble =
document.createElement("div");

bubble.className =
"bubble";

bubble.textContent =
text;

wrapper.appendChild(bubble);

chat.appendChild(wrapper);

if (save) {

history.push({
type: "user",
text
});

saveHistory();

}

scrollChat();

}

function addAIMessage(
text,
image = null,
website = null,
preview = null,
save = true
) {

const wrapper =
document.createElement("div");

wrapper.className =
"message ai";

const container =
document.createElement("div");

if (text) {

const bubble =
document.createElement("div");

bubble.className =
"bubble";

bubble.textContent =
text;

container.appendChild(bubble);

}

if (image) {

container.appendChild(
createImageCard(image)
);

}

if (website) {

container.appendChild(
createWebsiteCard(website)
);

}

if (preview) {

container.appendChild(
createPreviewCard(preview)
);

}

wrapper.appendChild(container);

chat.appendChild(wrapper);

if (save) {

history.push({
type: "ai",
text: text || "",
image: image || null,
website: website || null,
preview: preview || null
});

saveHistory();

}

scrollChat();

}

/*
============================================================
IMAGE CARD
============================================================
*/

function createImageCard(image) {

const imageCard =
document.createElement("div");

imageCard.className =
"image-card";

const img =
document.createElement("img");

img.src =
image;

img.alt =
"Image generated by Avocado AI";

img.loading =
"lazy";

imageCard.appendChild(img);

const label =
document.createElement("div");

label.className =
"image-label";

label.textContent =
"Generated by Avocado AI";

imageCard.appendChild(label);

return imageCard;

}

/*
============================================================
WEBSITE HELPERS
============================================================
*/

function cleanSiteName(name) {

return String(name || "")
.toLowerCase()
.trim()
.replace(/[^a-z0-9-]+/g, "-")
.replace(/^-+|-+$/g, "");

}

function getPlanteerURL(siteName) {

const clean =
cleanSiteName(siteName);

if (!clean) return null;

return (
PLANTEER_BASE +
encodeURIComponent(clean) +
"/"
);

}

function getWebsiteURL(website) {

if (!website) return null;

if (
typeof website.url === "string" &&
website.url
) {

return website.url;

}

if (
typeof website.site_url === "string" &&
website.site_url
) {

return website.site_url;

}

if (
typeof website.preview_url === "string" &&
website.preview_url
) {

return website.preview_url;

}

if (
typeof website.site_name === "string"
) {

return getPlanteerURL(
website.site_name
);

}

return null;

}

function getFileType(path) {

const value =
String(path || "");

const lastDot =
value.lastIndexOf(".");

if (
lastDot < 0 ||
lastDot === value.length - 1
) {

return "file";

}

return value
.slice(lastDot + 1)
.toUpperCase();

}

/*
============================================================
WEBSITE CARD
============================================================
*/

function createWebsiteCard(website) {

const card =
document.createElement("div");

card.className =
"website-card";

const header =
document.createElement("div");

header.className =
"website-card-header";

const title =
document.createElement("div");

title.className =
"website-card-title";

title.textContent =
website.site_name
? website.site_name
: "Website";

const state =
document.createElement("div");

state.className =
"website-card-status";

state.textContent =
website.published
? "Published"
: "Created";

header.appendChild(title);
header.appendChild(state);

card.appendChild(header);

const body =
document.createElement("div");

body.className =
"website-card-body";

if (website.description) {

const description =
document.createElement("div");

description.className =
"website-description";

description.textContent =
website.description;

body.appendChild(description);

}

const websiteURL =
getWebsiteURL(website);

if (websiteURL) {

const link =
document.createElement("a");

link.className =
"website-link";

link.href =
websiteURL;

link.target =
"_blank";

link.rel =
"noopener noreferrer";

link.textContent =
websiteURL;

body.appendChild(link);

}

if (
Array.isArray(website.files) &&
website.files.length
) {

const files =
document.createElement("div");

files.className =
"website-files";

const filesTitle =
document.createElement("div");

filesTitle.className =
"website-files-title";

filesTitle.textContent =
"Files";

files.appendChild(filesTitle);

for (
const file of website.files
) {

const row =
document.createElement("div");

row.className =
"file-row";

const icon =
document.createElement("div");

icon.className =
"file-icon";

icon.textContent =
"📄";

const name =
document.createElement("div");

name.className =
"file-name";

name.textContent =
file.path || "unknown";

const type =
document.createElement("div");

type.className =
"file-type";

type.textContent =
file.content_type ||
getFileType(file.path);

row.appendChild(icon);
row.appendChild(name);
row.appendChild(type);

files.appendChild(row);

}

body.appendChild(files);

}

const actions =
document.createElement("div");

actions.className =
"website-actions";

if (websiteURL) {

const open =
document.createElement("button");

open.type =
"button";

open.className =
"website-action";

open.textContent =
"Open website";

open.addEventListener(
"click",
function() {

window.open(
websiteURL,
"_blank",
"noopener,noreferrer"
);

}
);

actions.appendChild(open);

}

if (website.id) {

const ask =
document.createElement("button");

ask.type =
"button";

ask.className =
"website-action";

ask.textContent =
"Work on this site";

ask.addEventListener(
"click",
function() {

promptBox.value =
"Work on my website " +
website.site_name +
".";

promptBox.focus();

}
);

actions.appendChild(ask);

}

if (actions.children.length) {

body.appendChild(actions);

}

card.appendChild(body);

return card;

}

/*
============================================================
LIVE PREVIEW
============================================================
*/

function normalizePreview(preview) {

if (!preview) return null;

if (typeof preview === "string") {

if (
preview.startsWith("http://") ||
preview.startsWith("https://")
) {

return {
url: preview
};

}

return {
html: preview
};

}

if (typeof preview !== "object") {
return null;
}

const normalized = {
...preview
};

if (
!normalized.url &&
typeof normalized.preview_url === "string"
) {

normalized.url =
normalized.preview_url;

}

if (
!normalized.url &&
typeof normalized.previewUrl === "string"
) {

normalized.url =
normalized.previewUrl;

}

if (
!normalized.html &&
typeof normalized.preview_html === "string"
) {

normalized.html =
normalized.preview_html;

}

if (
!normalized.html &&
typeof normalized.previewHtml === "string"
) {

normalized.html =
normalized.previewHtml;

}

return normalized;

}

function createPreviewCard(preview) {

preview =
normalizePreview(preview);

if (!preview) return null;

const card =
document.createElement("div");

card.className =
"preview-card";

const header =
document.createElement("div");

header.className =
"preview-header";

const title =
document.createElement("div");

title.className =
"preview-title";

title.textContent =
preview.title ||
"Live website preview";

const status =
document.createElement("div");

status.className =
"preview-status";

status.textContent =
"Preview";

header.appendChild(title);
header.appendChild(status);

card.appendChild(header);

const frameWrap =
document.createElement("div");

frameWrap.className =
"preview-frame-wrap";

const frame =
document.createElement("iframe");

frame.className =
"preview-frame";

frame.title =
"Avocado AI live website preview";

frame.setAttribute(
"sandbox",
"allow-scripts allow-forms allow-modals allow-popups allow-popups-to-escape-sandbox"
);

if (preview.url) {

frame.src =
preview.url;

} else if (preview.html) {

const blob =
new Blob(
[preview.html],
{
type: "text/html"
}
);

frame.src =
URL.createObjectURL(blob);

}

frameWrap.appendChild(frame);

card.appendChild(frameWrap);

if (preview.url) {

const url =
document.createElement("div");

url.className =
"preview-url";

url.textContent =
preview.url;

card.appendChild(url);

}

const actions =
document.createElement("div");

actions.className =
"preview-actions";

const approve =
document.createElement("button");

approve.type =
"button";

approve.className =
"preview-button preview-approve";

approve.textContent =
"Approve preview";

approve.addEventListener(
"click",
function() {

status.textContent =
"Approved";

status.style.color =
"#35ff88";

approve.disabled =
true;

reject.disabled =
true;

promptBox.value =
"Publish the approved website.";

promptBox.focus();

}
);

const reject =
document.createElement("button");

reject.type =
"button";

reject.className =
"preview-button preview-reject";

reject.textContent =
"Reject / request changes";

reject.addEventListener(
"click",
function() {

status.textContent =
"Changes requested";

status.style.color =
"#ffb86b";

promptBox.value =
"Change the website preview. ";

promptBox.focus();

}
);

actions.appendChild(approve);
actions.appendChild(reject);

if (preview.url) {

const open =
document.createElement("button");

open.type =
"button";

open.className =
"preview-button preview-open";

open.textContent =
"Open preview";

open.addEventListener(
"click",
function() {

window.open(
preview.url,
"_blank",
"noopener,noreferrer"
);

}
);

actions.appendChild(open);

}

card.appendChild(actions);

return card;

}

/*

THINKING ANIMATION

*/

function addTyping() {

removeTyping();

const wrapper =
document.createElement("div");

wrapper.className =
"message ai";

wrapper.id =
"typingMessage";

const bubble =
document.createElement("div");

bubble.className =
"bubble thinking-bubble";

const label =
document.createElement("span");

label.className =
"thinking-label";

label.textContent =
"Avocado AI is thinking";

const dots =
document.createElement("div");

dots.className =
"thinking-dots";

for (
let i = 0;
i < 3;
i++
) {

const dot =
document.createElement("span");

dot.className =
"thinking-dot";

dots.appendChild(dot);

}

bubble.appendChild(label);
bubble.appendChild(dots);

wrapper.appendChild(bubble);

chat.appendChild(wrapper);

thinkingStartTime =
Date.now();

thinkingTimer =
setInterval(
function() {

const elapsed =
Math.floor(
(Date.now() -
thinkingStartTime) /
1000
);

const labelText =
wrapper.querySelector(
".thinking-label"
);

if (!labelText) return;

if (elapsed < 2) {

labelText.textContent =
"Avocado AI is thinking";

} else if (elapsed < 5) {

labelText.textContent =
"Avocado AI is working";

} else if (elapsed < 10) {

labelText.textContent =
"Avocado AI is building";

} else {

labelText.textContent =
"Avocado AI is still working";

}

},
1000
);

scrollChat();

}

function removeTyping() {

if (thinkingTimer) {

clearInterval(
thinkingTimer
);

thinkingTimer = null;

}

const typing =
document.getElementById(
"typingMessage"
);

if (typing) {

typing.remove();

}

}

/*
============================================================
RESPONSE EXTRACTION
============================================================
*/

function extractImage(data) {

if (
typeof data.image_url === "string" &&
data.image_url
) {

return data.image_url;

}

if (
typeof data.imageUrl === "string" &&
data.imageUrl
) {

return data.imageUrl;

}

if (
typeof data.image === "string" &&
data.image
) {

if (
data.image.startsWith(
"data:image/"
)
) {

return data.image;

}

if (
data.image.startsWith(
"http://"
) ||
data.image.startsWith(
"https://"
)
) {

return data.image;

}

return (
"data:image/png;base64," +
data.image
);

}

if (
typeof data.image_base64 === "string" &&
data.image_base64
) {

return (
"data:image/png;base64," +
data.image_base64
);

}

if (
typeof data.imageBase64 === "string" &&
data.imageBase64
) {

return (
"data:image/png;base64," +
data.imageBase64
);

}

if (
data.result &&
typeof data.result.image === "string"
) {

const value =
data.result.image;

if (
value.startsWith(
"data:image/"
)
) {

return value;

}

return (
"data:image/png;base64," +
value
);

}

return null;

}

function extractText(data) {

if (
typeof data.response === "string"
) {

return data.response;

}

if (
typeof data.text === "string"
) {

return data.text;

}

if (
typeof data.message === "string"
) {

return data.message;

}

if (
data.result &&
typeof data.result.response === "string"
) {

return data.result.response;

}

return "";

}

/*
============================================================
WEBSITE EXTRACTION
============================================================
*/

function extractWebsite(data) {

if (
data.website &&
typeof data.website === "object"
) {

return {
...data.website,
files:
Array.isArray(data.files)
? data.files
: data.website.files || []
};

}

if (
data.generated_website &&
typeof data.generated_website === "object"
) {

return {
...data.generated_website,
files:
Array.isArray(
data.generated_website.files
)
? data.generated_website.files
: []
};

}

return null;

}

/*
============================================================
PREVIEW EXTRACTION
============================================================
*/

function extractPreview(data) {

if (
data.preview &&
typeof data.preview === "object"
) {

return normalizePreview(
data.preview
);

}

if (
typeof data.preview === "string"
) {

return normalizePreview(
data.preview
);

}

if (
typeof data.preview_url === "string" &&
data.preview_url
) {

return {
url: data.preview_url,
title: "Live website preview"
};

}

if (
typeof data.previewUrl === "string" &&
data.previewUrl
) {

return {
url: data.previewUrl,
title: "Live website preview"
};

}

if (
typeof data.preview_html === "string" &&
data.preview_html
) {

return {
html: data.preview_html,
title: "Live website preview"
};

}

if (
typeof data.previewHtml === "string" &&
data.previewHtml
) {

return {
html: data.previewHtml,
title: "Live website preview"
};

}

if (
data.website &&
typeof data.website === "object"
) {

if (
typeof data.website.preview_url === "string"
) {

return {
url: data.website.preview_url,
title:
data.website.site_name ||
"Live website preview"
};

}

if (
typeof data.website.preview_html === "string"
) {

return {
html: data.website.preview_html,
title:
data.website.site_name ||
"Live website preview"
};

}

if (
typeof data.website.previewUrl === "string"
) {

return {
url: data.website.previewUrl,
title:
data.website.site_name ||
"Live website preview"
};

}

if (
typeof data.website.previewHtml === "string"
) {

return {
html: data.website.previewHtml,
title:
data.website.site_name ||
"Live website preview"
};

}

}

return null;

}

/*
============================================================
FETCH
============================================================
*/

async function requestJSON(
url,
options = {}
) {

const response =
await fetch(
url,
{
credentials: "include",
...options
}
);

let data = null;

try {

data =
await response.json();

} catch {

throw new Error(
"The Worker returned an invalid response."
);

}

if (!response.ok) {

throw new Error(
data.error ||
"Worker request failed."
);

}

return data;

}

/*
============================================================
SEND MESSAGE
============================================================
*/

async function sendMessage() {

const prompt =
promptBox.value.trim();

if (!prompt) return;

promptBox.value = "";

addUserMessage(prompt);

sendButton.disabled =
true;

promptBox.disabled =
true;

statusText.textContent =
"Thinking...";

addTyping();

try {

const data =
await requestJSON(
AI_ENDPOINT,
{
method: "POST",

headers: {
"Content-Type":
"application/json"
},

body: JSON.stringify({

prompt,

messages:
history
.filter(
x =>
x.type === "user" ||
x.type === "ai"
)
.slice(-12)
.map(
x => ({
role:
x.type === "user"
? "user"
: "assistant",
content:
x.text || ""
})
)

})
}
);

removeTyping();

const text =
extractText(data);

const image =
extractImage(data);

const website =
extractWebsite(data);

const preview =
extractPreview(data);

if (
!text &&
!image &&
!website &&
!preview
) {

throw new Error(
"Avocado AI returned no text, image, website, or preview."
);

}

addAIMessage(
text,
image,
website,
preview
);

if (website) {

updateWebsiteList();

}

statusText.textContent =
"Online";

} catch (error) {

removeTyping();

addAIMessage(
"Avocado AI error: " +
(
error.message ||
"Unknown error."
),
null,
null,
null
);

statusText.textContent =
"Error";

} finally {

sendButton.disabled =
false;

promptBox.disabled =
false;

promptBox.focus();

}

}

/*
============================================================
IMAGE GENERATION
============================================================
*/

async function generateImageFromPrompt(
prompt
) {

const data =
await requestJSON(
IMAGE_ENDPOINT,
{
method: "POST",

headers: {
"Content-Type":
"application/json"
},

body: JSON.stringify({
prompt
})

}
);

return extractImage(data);

}

function isImageRequest(text) {

const lower =
text.toLowerCase();

const words = [
"generate an image",
"generate image",
"make an image",
"create an image",
"draw an image",
"create a picture",
"make a picture",
"generate a picture",
"draw me",
"make me a picture"
];

return words.some(
word =>
lower.includes(word)
);

}

composer.addEventListener(
"submit",
function(event) {

event.preventDefault();

const text =
promptBox.value.trim();

if (!text) return;

if (
isImageRequest(text)
) {

generateImageDirectly(text);

return;

}

sendMessage();

}
);

async function generateImageDirectly(
prompt
) {

promptBox.value = "";

addUserMessage(prompt);

sendButton.disabled =
true;

promptBox.disabled =
true;

statusText.textContent =
"Generating image...";

addTyping();

try {

const image =
await generateImageFromPrompt(
prompt
);

removeTyping();

if (!image) {

throw new Error(
"Avocado AI did not return an image."
);

}

addAIMessage(
"Here is the image I generated.",
image,
null,
null
);

statusText.textContent =
"Online";

} catch (error) {

removeTyping();

addAIMessage(
"Avocado AI image error: " +
(
error.message ||
"Unknown error."
),
null,
null,
null
);

statusText.textContent =
"Error";

} finally {

sendButton.disabled =
false;

promptBox.disabled =
false;

promptBox.focus();

}

}

ENTER KEY

*/

promptBox.addEventListener(

function renderWebsiteList() {

!websites.length
) {

document.createElement("div");

empty.className =
"website-empty";

empty.textContent =
"No websites found. Create one with Avocado AI.";

websiteList.appendChild(empty);

return;

}

for (
const website of websites
) {

document.createElement("button");

item.type =
"button";

item.className =
"website-item";

const name =
document.createElement("div");

name.className =
"website-name";

name.textContent =
website.site_name ||
"Unnamed website";

const meta =
document.createElement("div");

meta.className =
"website-meta";

meta.textContent =
website.published
? "Published"
: "Not published";

item.appendChild(meta);

getWebsiteURL(website);

);

promptBox.value =
"Work on my website " +
website.site_name +
".";

promptBox.focus();

}

}
);

websiteList.appendChild(item);

}

}

async function updateWebsiteList() {

try {

await requestJSON(
WEBSITES_ENDPOINT,

}
);

: [];

"website-empty";
