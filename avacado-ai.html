<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Avocado AI</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  font-family: Segoe UI, Arial, sans-serif;
  background: #05070b;
  color: #eee;
}

body {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  overflow-x: hidden;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background:
    radial-gradient(circle at 20% 20%, rgba(53,255,136,.08), transparent 25%),
    radial-gradient(circle at 80% 80%, rgba(80,140,255,.08), transparent 25%);
  z-index: -1;
}

.app {
  width: min(1100px, 100%);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  padding: 20px;
}

.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
  padding: 18px 20px;
  border: 1px solid #1c2936;
  border-radius: 18px;
  background: rgba(16,21,31,.92);
}

.logo {
  display: flex;
  align-items: center;
  gap: 12px;
}

.avocado {
  width: 45px;
  height: 45px;
  border-radius: 50%;
  background: #35ff88;
  display: grid;
  place-items: center;
  color: #07140d;
  font-size: 24px;
  font-weight: 900;
}

.title {
  font-size: 21px;
  font-weight: 800;
}

.subtitle {
  color: #9fb2c5;
  font-size: 13px;
  margin-top: 3px;
}

.status {
  font-size: 12px;
  color: #35ff88;
}

.chat {
  flex: 1;
  margin-top: 18px;
  padding: 10px 0 25px;
}

.message {
  display: flex;
  margin: 15px 0;
}

.message.user {
  justify-content: flex-end;
}

.bubble {
  max-width: min(800px, 90%);
  padding: 14px 17px;
  border-radius: 17px;
  line-height: 1.55;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.message.ai .bubble {
  background: #10151f;
  border: 1px solid #1d2a38;
}

.message.user .bubble {
  background: #35ff88;
  color: #06130b;
}

.image-card {
  margin-top: 12px;
  padding: 10px;
  background: #0c1119;
  border: 1px solid #253342;
  border-radius: 16px;
  max-width: 800px;
}

.image-card img {
  display: block;
  width: 100%;
  max-height: 700px;
  object-fit: contain;
  border-radius: 10px;
  background: #05070b;
}

.image-label {
  color: #9fb2c5;
  font-size: 12px;
  margin-top: 8px;
}

.typing {
  color: #9fb2c5;
  font-style: italic;
}

.composer {
  position: sticky;
  bottom: 15px;
  display: flex;
  gap: 10px;
  padding: 12px;
  background: rgba(16,21,31,.96);
  border: 1px solid #1c2936;
  border-radius: 18px;
}

#prompt {
  flex: 1;
  min-width: 0;
  resize: none;
  min-height: 50px;
  max-height: 180px;
  padding: 14px;
  border: 1px solid #263646;
  border-radius: 12px;
  outline: none;
  background: #080c12;
  color: #eee;
  font: inherit;
}

#prompt:focus {
  border-color: #35ff88;
}

button {
  border: 0;
  border-radius: 12px;
  padding: 0 20px;
  background: #35ff88;
  color: #06130b;
  font-weight: 800;
  cursor: pointer;
  min-width: 90px;
}

button:disabled {
  opacity: .55;
  cursor: not-allowed;
}

#clearButton {
  min-width: auto;
  padding: 10px 14px;
  background: #18222d;
  color: #eee;
}

.controls {
  display: flex;
  align-items: center;
  gap: 10px;
}

@media (max-width: 650px) {
  .app {
    padding: 10px;
  }

  .status {
    display: none;
  }

  .composer {
    flex-direction: column;
  }

  button {
    min-height: 48px;
  }

  .bubble {
    max-width: 95%;
  }
}
</style>
</head>

<body>

<div class="app">

<header class="header">

<div class="logo">

<div class="avocado">🥑</div>

<div>
<div class="title">Avocado AI</div>
<div class="subtitle">The Hard Planet AI</div>
</div>

</div>

<div class="controls">
<div class="status" id="status">Online</div>
<button id="clearButton" type="button">Clear</button>
</div>

</header>

<main class="chat" id="chat"></main>

<form class="composer" id="composer">

<textarea
id="prompt"
placeholder="Talk to Avocado AI..."
autocomplete="off"
></textarea>

<button id="sendButton" type="submit">
Send
</button>

</form>

</div>

<script>

const WORKER_URL =
"https://hard-planet-hosting.josiahdduncan.workers.dev";

const AI_ENDPOINT =
WORKER_URL + "/api/ai";

const chat =
document.getElementById("chat");

const composer =
document.getElementById("composer");

const promptBox =
document.getElementById("prompt");

const sendButton =
document.getElementById("sendButton");

const clearButton =
document.getElementById("clearButton");

const statusText =
document.getElementById("status");

let history = [];

function saveHistory() {

try {

localStorage.setItem(
"avocado_ai_history",
JSON.stringify(history)
);

} catch {}

}

function loadHistory() {

try {

const saved =
localStorage.getItem(
"avocado_ai_history"
);

if (!saved) return;

const parsed =
JSON.parse(saved);

if (!Array.isArray(parsed)) return;

history = parsed;

for (const item of history) {

if (item.type === "user") {

addUserMessage(
item.text,
false
);

}

if (item.type === "ai") {

addAIMessage(
item.text || "",
item.image || null,
false
);

}

}

} catch {}

}

function addUserMessage(
text,
save = true
) {

const wrapper =
document.createElement("div");

wrapper.className =
"message user";

const bubble =
document.createElement("div");

bubble.className =
"bubble";

bubble.textContent =
text;

wrapper.appendChild(bubble);

chat.appendChild(wrapper);

if (save) {

history.push({
type: "user",
text: text
});

saveHistory();

}

scrollChat();

}

function addAIMessage(
text,
image,
save = true
) {

const wrapper =
document.createElement("div");

wrapper.className =
"message ai";

const container =
document.createElement("div");

if (text) {

const bubble =
document.createElement("div");

bubble.className =
"bubble";

bubble.textContent =
text;

container.appendChild(bubble);

}

if (image) {

const imageCard =
document.createElement("div");

imageCard.className =
"image-card";

const img =
document.createElement("img");

img.src =
image;

img.alt =
"Image generated by Avocado AI";

img.loading =
"lazy";

imageCard.appendChild(img);

const label =
document.createElement("div");

label.className =
"image-label";

label.textContent =
"Generated by Avocado AI";

imageCard.appendChild(label);

container.appendChild(imageCard);

}

wrapper.appendChild(container);

chat.appendChild(wrapper);

if (save) {

history.push({
type: "ai",
text: text || "",
image: image || null
});

saveHistory();

}

scrollChat();

}

function addTyping() {

const wrapper =
document.createElement("div");

wrapper.className =
"message ai";

wrapper.id =
"typingMessage";

const bubble =
document.createElement("div");

bubble.className =
"bubble typing";

bubble.textContent =
"Avocado AI is thinking...";

wrapper.appendChild(bubble);

chat.appendChild(wrapper);

scrollChat();

}

function removeTyping() {

const typing =
document.getElementById(
"typingMessage"
);

if (typing) {
typing.remove();
}

}

function scrollChat() {

window.scrollTo({
top: document.body.scrollHeight,
behavior: "smooth"
});

}

function extractImage(data) {

if (
typeof data.image_url === "string" &&
data.image_url
) {

return data.image_url;

}

if (
typeof data.imageUrl === "string" &&
data.imageUrl
) {

return data.imageUrl;

}

if (
typeof data.image === "string" &&
data.image
) {

if (
data.image.startsWith("data:image/")
) {

return data.image;

}

if (
data.image.startsWith("http://") ||
data.image.startsWith("https://")
) {

return data.image;

}

return "data:image/png;base64," +
data.image;

}

if (
typeof data.image_base64 === "string" &&
data.image_base64
) {

return "data:image/png;base64," +
data.image_base64;

}

if (
typeof data.imageBase64 === "string" &&
data.imageBase64
) {

return "data:image/png;base64," +
data.imageBase64;

}

if (
data.result &&
typeof data.result.image === "string"
) {

const value =
data.result.image;

if (
value.startsWith("data:image/")
) {

return value;

}

return "data:image/png;base64," +
value;

}

return null;

}

function extractText(data) {

if (
typeof data.response === "string"
) {

return data.response;

}

if (
typeof data.text === "string"
) {

return data.text;

}

if (
typeof data.message === "string"
) {

return data.message;

}

if (
data.result &&
typeof data.result.response === "string"
) {

return data.result.response;

}

return "";

}

async function sendMessage() {

const prompt =
promptBox.value.trim();

if (!prompt) return;

promptBox.value = "";

addUserMessage(prompt);

sendButton.disabled = true;
promptBox.disabled = true;

statusText.textContent =
"Thinking...";

addTyping();

try {

const response =
await fetch(
AI_ENDPOINT,
{
method: "POST",

headers: {
"Content-Type":
"application/json"
},

body: JSON.stringify({
prompt: prompt
})

}
);

let data;

try {

data =
await response.json();

} catch {

throw new Error(
"The Worker returned an invalid response."
);

}

if (!response.ok) {

throw new Error(
data.error ||
"Avocado AI request failed."
);

}

removeTyping();

const text =
extractText(data);

const image =
extractImage(data);

if (!text && !image) {

throw new Error(
"Avocado AI returned no text or image."
);

}

addAIMessage(
text,
image
);

statusText.textContent =
"Online";

} catch (error) {

removeTyping();

addAIMessage(
"Avocado AI error: " +
(
error.message ||
"Unknown error."
),
null
);

statusText.textContent =
"Error";

} finally {

sendButton.disabled =
false;

promptBox.disabled =
false;

promptBox.focus();

}

}

composer.addEventListener(
"submit",
function(event) {

event.preventDefault();

sendMessage();

}
);

promptBox.addEventListener(
"keydown",
function(event) {

if (
event.key === "Enter" &&
!event.shiftKey
) {

event.preventDefault();

sendMessage();

}

}
);

clearButton.addEventListener(
"click",
function() {

history = [];

try {

localStorage.removeItem(
"avocado_ai_history"
);

} catch {}

chat.innerHTML = "";

addAIMessage(
"Chat cleared. What would you like to do?",
null,
false
);

}
);

loadHistory();

if (!history.length) {

addAIMessage(
"Hello! I'm Avocado AI. You can ask me questions or request an image.",
null,
false
);

}

</script>

</body>
</html>
